<script>
(function(){
"use strict";
var main = document.getElementById("contenido");
var store = { get:function(k){ try{ return JSON.parse(localStorage.getItem("farmaP1:"+k)); }catch(e){ return null; } },
              set:function(k,v){ try{ localStorage.setItem("farmaP1:"+k, JSON.stringify(v)); }catch(e){} } };
function md(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function blockOf(n){ for(var i=0;i<BLOQUES.length;i++){ if(BLOQUES[i].temas.indexOf(n)>-1) return BLOQUES[i]; } }
function cvar(b){ return "var(--"+b.color+")"; }
function best(n){ var s = store.get("t"+n); return s ? s : null; }

/* ---------- índice lateral ---------- */
function buildTabs(){
  var h = "";
  BLOQUES.forEach(function(b){
    h += '<div class="tab" data-b="'+b.id+'" style="--c:'+cvar(b)+'"><button type="button" aria-expanded="false"><span class="chip">'+b.id+'</span><span class="tt">'+b.nombre+'<small>Temas '+b.temas[0]+'–'+b.temas[b.temas.length-1]+'</small></span></button><ol>';
    b.temas.forEach(function(n){
      var s = best(n);
      h += '<li><a href="#tema-'+n+'" data-r="tema-'+n+'"><span class="n">'+n+'</span><span>'+TEMAS[n].t+'</span>'+(s?'<span class="done" title="Mejor resultado en la autoevaluación">'+s.ok+'/'+s.tot+'</span>':'')+'</a></li>';
    });
    h += '</ol></div>';
  });
  document.getElementById("tabs").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".tab > button"), function(btn){
    btn.addEventListener("click", function(){ var t = btn.parentNode; t.classList.toggle("open"); btn.setAttribute("aria-expanded", t.classList.contains("open")); });
  });
}
function markNav(route){
  Array.prototype.forEach.call(document.querySelectorAll("[data-r]"), function(a){ if(a.getAttribute("data-r")===route) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  var m = /^tema-(\d+)$/.exec(route);
  if(m){ var b = blockOf(+m[1]); var tab = document.querySelector('.tab[data-b="'+b.id+'"]'); if(tab){ tab.classList.add("open"); tab.querySelector("button").setAttribute("aria-expanded","true"); } }
}

/* ---------- portada ---------- */
function home(){
  var h = '<section class="hero"><h1>Farmacología clínica para Enfermería</h1><p>Los seis bloques del primer parcial en un solo sitio: las ideas que no se pueden olvidar, los grupos de fármacos con sus ejemplos y avisos de seguridad, y una autoevaluación al final de cada tema.</p></section>';
  h += '<div class="binder">';
  BLOQUES.forEach(function(b){
    var done=0; b.temas.forEach(function(n){ if(best(n)) done++; });
    h += '<a href="#tema-'+b.temas[0]+'" style="--c:'+cvar(b)+'"><span class="roman">'+b.id+'</span><h2>'+b.nombre+'</h2><p>'+b.desc+'</p><p>Temas '+b.temas.join(", ")+'</p><div class="bar" aria-label="'+done+' de '+b.temas.length+' temas autoevaluados"><i style="width:'+(100*done/b.temas.length)+'%"></i></div></a>';
  });
  h += '</div><div class="how">'+
    '<div><h3>Recorre los temas</h3><p>Usa las pestañas de colores de la izquierda. Cada bloque tiene su color, el mismo que en las diapositivas.</p></div>'+
    '<div><h3>Abre las fichas</h3><p>Cada grupo farmacológico tiene su ficha: mecanismo, ejemplos, lo esencial y lo que vigila enfermería.</p></div>'+
    '<div><h3>Autoevalúate</h3><p>Al final de cada tema hay preguntas con explicación. Tu mejor resultado queda guardado en este navegador.</p></div>'+
    '<div><h3>Repasa mezclando</h3><p>En «Repaso» puedes generar un test aleatorio de los bloques que elijas.</p></div></div>';
  h += footer();
  return h;
}
function footer(){ return '<footer>Material de apoyo de la asignatura de Farmacología clínica (Grado en Enfermería, UPNA). No sustituye a las clases ni a la ficha técnica de cada medicamento.</footer>'; }

/* ---------- tema ---------- */
function shuffled(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); for(var k=n-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; } return a; }
function quizHTML(qs, id){
  var L="ABCDEF", h='<div class="quiz" id="'+id+'">';
  qs.forEach(function(q,i){
    var ord = shuffled(q.o.length), c = ord.indexOf(q.c);
    h += '<div class="q" data-c="'+c+'"><h3><span class="num">'+(i+1)+'</span>'+md(q.q)+'</h3><div class="opts">';
    ord.forEach(function(oi,j){ h += '<button type="button" data-j="'+j+'"><span class="l">'+L[j]+'</span><span>'+md(q.o[oi])+'</span></button>'; });
    h += '</div><div class="expl" aria-live="polite"></div><template>'+md(q.e)+'</template></div>';
  });
  h += '<div class="score"><p class="res">Responde a las '+qs.length+' preguntas.</p><button type="button" class="btn ghost again">Volver a empezar</button></div></div>';
  return h;
}
function wireQuiz(id, onDone){
  var box = document.getElementById(id); if(!box) return;
  var qs = box.querySelectorAll(".q"), answered=0, ok=0;
  Array.prototype.forEach.call(qs, function(q){
    var c = +q.getAttribute("data-c"), ex = q.querySelector(".expl"), tpl = q.querySelector("template");
    Array.prototype.forEach.call(q.querySelectorAll(".opts button"), function(b){
      b.addEventListener("click", function(){
        var j = +b.getAttribute("data-j"), right = (j===c);
        Array.prototype.forEach.call(q.querySelectorAll(".opts button"), function(x){ x.disabled=true; if(+x.getAttribute("data-j")===c) x.classList.add("ok"); });
        if(!right) b.classList.add("bad");
        ex.innerHTML = (right?'<b class="r">Correcto.</b> ':'<b class="w">No es esa.</b> ') + tpl.innerHTML;
        ex.classList.add("show");
        answered++; if(right) ok++;
        if(answered===qs.length){
          box.querySelector(".res").textContent = "Resultado: "+ok+" de "+qs.length+" correctas.";
          if(onDone) onDone(ok, qs.length);
        } else box.querySelector(".res").textContent = "Llevas "+ok+" de "+answered+".";
      });
    });
  });
  box.querySelector(".again").addEventListener("click", function(){ render(true); });
}
function tema(n){
  var T = TEMAS[n], b = blockOf(n);
  if(!T) return notFound();
  var h = '<div style="--c:'+cvar(b)+'">';
  h += '<header class="thead"><span class="big" aria-hidden="true">'+n+'</span><span class="blk">Bloque '+b.id+'. '+b.nombre+'</span><h1>Tema '+n+'. '+T.t+'</h1></header>';
  h += '<p class="lede">'+md(T.idea)+'</p>';
  h += '<h2 class="sec">Lo esencial</h2><ul class="keys">'+T.claves.map(function(k){ return '<li>'+md(k)+'</li>'; }).join("")+'</ul>';
  if(T.fig && FIGS[T.fig]) h += '<figure class="figure">'+FIGS[T.fig].svg+'<figcaption>'+FIGS[T.fig].cap+'</figcaption></figure>';
  if(T.fig2 && FIGS[T.fig2]) h += '<figure class="figure">'+FIGS[T.fig2].svg+'<figcaption>'+FIGS[T.fig2].cap+'</figcaption></figure>';
  h += '<h2 class="sec">'+(T.conceptos?'Conceptos clave':'Grupos y fármacos')+'</h2><div class="fichas">';
  T.grupos.forEach(function(g,i){
    h += '<details class="ficha"'+(i===0?' open':'')+'><summary><span class="strip"></span><span class="nm"><b>'+md(g.n)+'</b>'+(g.sub?'<span>'+md(g.sub)+'</span>':'')+'</span><span class="pm" aria-hidden="true">+</span></summary><div class="body">';
    if(g.mec) h += '<div class="row"><b>'+(T.conceptos?'Qué es':'Cómo actúa')+'</b><div>'+md(g.mec)+'</div></div>';
    if(g.ej && g.ej.length) h += '<div class="row"><b>'+(T.conceptos?'Ejemplos':'Fármacos')+'</b><div class="chips">'+g.ej.map(function(e){ return '<span>'+md(e)+'</span>'; }).join("")+'</div></div>';
    if(g.clave) h += '<div class="row"><b>Lo esencial</b><div>'+md(g.clave)+'</div></div>';
    if(g.alerta) h += '<div class="alerta">⚠️ '+md(g.alerta)+'</div>';
    h += '</div></details>';
  });
  h += '</div>';
  if(T.alertas && T.alertas.length) h += '<h2 class="sec">Lo que vigila enfermería</h2><div class="alerts">'+T.alertas.map(function(a){ return '<div>'+md(a)+'</div>'; }).join("")+'</div>';
  if(T.enlaces) h += '<p class="links">🔗 '+md(T.enlaces)+'</p>';
  h += '<h2 class="sec" id="autoevaluacion">Autoevaluación</h2>'+quizHTML(T.quiz, "quiz-"+n);
  var all = []; BLOQUES.forEach(function(x){ all = all.concat(x.temas); });
  var i = all.indexOf(n), prev = all[i-1], next = all[i+1];
  h += '<nav class="pager" aria-label="Temas anterior y siguiente">'+(prev?'<a href="#tema-'+prev+'"><small>Anterior</small>Tema '+prev+'. '+TEMAS[prev].t+'</a>':'<span></span>')+(next?'<a href="#tema-'+next+'" style="text-align:right"><small>Siguiente</small>Tema '+next+'. '+TEMAS[next].t+'</a>':'')+'</nav>';
  h += footer()+'</div>';
  return h;
}

/* ---------- repaso ---------- */
var repasoSel = null;
function repaso(){
  if(!repasoSel) repasoSel = BLOQUES.map(function(b){ return b.id; });
  var h = '<header class="thead" style="--c:var(--ink)"><span class="big" aria-hidden="true">?</span><span class="blk">Test aleatorio</span><h1>Repaso mezclando temas</h1></header>';
  h += '<p class="lede">Elige los bloques y genera un test de 10 preguntas al azar. Cada vez que pulses el botón saldrán preguntas distintas.</p><div class="filters">';
  BLOQUES.forEach(function(b){ h += '<label style="--c:'+cvar(b)+'"><input type="checkbox" value="'+b.id+'"'+(repasoSel.indexOf(b.id)>-1?' checked':'')+'> Bloque '+b.id+'</label>'; });
  h += '</div><button type="button" class="btn" id="gen">Generar test de 10 preguntas</button><div id="rq" style="margin-top:22px"></div>'+footer();
  return h;
}
function wireRepaso(){
  var go = function(){
    repasoSel = Array.prototype.map.call(document.querySelectorAll(".filters input:checked"), function(i){ return i.value; });
    var pool = [];
    BLOQUES.forEach(function(b){ if(repasoSel.indexOf(b.id)>-1) b.temas.forEach(function(n){ TEMAS[n].quiz.forEach(function(q){ pool.push({q:"(Tema "+n+") "+q.q, o:q.o, c:q.c, e:q.e, b:b}); }); }); });
    if(!pool.length){ document.getElementById("rq").innerHTML = '<p class="empty">Marca al menos un bloque para generar el test.</p>'; return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    var sel = pool.slice(0,10);
    document.getElementById("rq").innerHTML = '<div style="--c:var(--ink)">'+quizHTML(sel,"quiz-repaso")+'</div>';
    wireQuiz("quiz-repaso");
    var again = document.querySelector("#quiz-repaso .again"); var fresh = again.cloneNode(true); fresh.textContent="Otro test"; again.parentNode.replaceChild(fresh, again); fresh.addEventListener("click", go);
  };
  document.getElementById("gen").addEventListener("click", go);
}

/* ---------- índice de fármacos ---------- */
var DRUGS = [];
function buildDrugs(){
  Object.keys(TEMAS).forEach(function(k){
    var n=+k, T=TEMAS[n]; if(T.conceptos) return;
    T.grupos.forEach(function(g){ (g.ej||[]).forEach(function(e){ DRUGS.push({d:e.replace(/\*\*/g,""), g:g.n.replace(/\*\*/g,""), n:n}); }); });
  });
  DRUGS.sort(function(a,b){ return a.d.localeCompare(b.d,"es"); });
}
function farmacos(){
  var h = '<header class="thead" style="--c:var(--ink)"><span class="big" aria-hidden="true">Rx</span><span class="blk">Índice alfabético</span><h1>Fármacos de la A a la Z</h1></header><p class="lede">Todos los fármacos que aparecen en las fichas, con su grupo. Pulsa uno para ir a su tema.</p><div class="az">';
  var cur="";
  DRUGS.forEach(function(x){
    var L = x.d.charAt(0).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(L!==cur){ cur=L; h += '<div class="letter">'+L+'</div>'; }
    var b = blockOf(x.n);
    h += '<a href="#tema-'+x.n+'" style="--c:'+cvar(b)+'"><i></i>'+md(x.d)+' <small>'+md(x.g)+' (T'+x.n+')</small></a>';
  });
  return h+'</div>'+footer();
}

/* ---------- búsqueda ---------- */
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function search(term){
  var t = norm(term), out = '<header class="thead" style="--c:var(--ink)"><span class="big" aria-hidden="true">⌕</span><span class="blk">Búsqueda</span><h1>Resultados para «'+md(term)+'»</h1></header><div class="results">', n=0;
  Object.keys(TEMAS).forEach(function(k){
    var T=TEMAS[k], b=blockOf(+k);
    if(norm(T.t).indexOf(t)>-1){ out += '<a href="#tema-'+k+'" style="--c:'+cvar(b)+'"><small>Tema '+k+'</small>'+T.t+'</a>'; n++; }
  });
  var seen={};
  DRUGS.forEach(function(x){
    var key=x.d+x.n; if(seen[key]) return;
    if(norm(x.d).indexOf(t)>-1 || norm(x.g).indexOf(t)>-1){ seen[key]=1; out += '<a href="#tema-'+x.n+'" style="--c:'+cvar(blockOf(x.n))+'"><small>'+md(x.g)+' · Tema '+x.n+'</small>'+md(x.d)+'</a>'; n++; }
  });
  if(!n) out += '<p class="empty">No hay coincidencias. Prueba con el nombre genérico (por ejemplo, «ibuprofeno» en lugar de una marca) o con el nombre de un grupo.</p>';
  return out+'</div>';
}
function notFound(){ return '<p class="empty">Esa página no existe. Vuelve al <a href="#inicio">inicio</a>.</p>'; }

/* ---------- enrutado ---------- */
function render(keepScroll){
  var r = (location.hash||"#inicio").slice(1) || "inicio", h;
  var m = /^tema-(\d+)$/.exec(r);
  if(m) h = tema(+m[1]); else if(r==="repaso") h = repaso(); else if(r==="farmacos") h = farmacos(); else { r="inicio"; h = home(); }
  main.innerHTML = h;
  markNav(r);
  if(m) wireQuiz("quiz-"+m[1], function(ok,tot){ var prev = best(+m[1]); if(!prev || ok>=prev.ok){ store.set("t"+m[1], {ok:ok, tot:tot}); buildTabs(); markNav(r); } });
  if(r==="repaso") wireRepaso();
  if(!keepScroll) window.scrollTo(0,0);
  document.body.classList.remove("menu"); document.getElementById("menuBtn").setAttribute("aria-expanded","false");
}
buildTabs(); buildDrugs();
window.addEventListener("hashchange", function(){ document.getElementById("q").value=""; render(); });
var qbox = document.getElementById("q"), qt;
qbox.addEventListener("input", function(){ clearTimeout(qt); qt = setTimeout(function(){ var v=qbox.value.trim(); if(v.length>=2){ main.innerHTML = search(v); markNav(""); } else render(true); }, 180); });
document.getElementById("menuBtn").addEventListener("click", function(){ var o = document.body.classList.toggle("menu"); this.setAttribute("aria-expanded", o); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") document.body.classList.remove("menu"); });
document.addEventListener("click", function(e){ if(document.body.classList.contains("menu") && !e.target.closest("#indice") && !e.target.closest("#menuBtn")) document.body.classList.remove("menu"); });
render();
})();
</script>
</body>
