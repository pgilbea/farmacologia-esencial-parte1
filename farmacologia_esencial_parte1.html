var TEMAS = {};

TEMAS[1] = {t:"Introducción a la farmacología", conceptos:true,
idea:"Un medicamento es mucho más que su principio activo: tiene excipientes, un nombre, una forma farmacéutica, una vía de administración y unas condiciones de dispensación que condicionan cómo se usa.",
claves:[
"**Fármaco** es toda sustancia que modifica una función del organismo; **medicamento** es la que se usa para prevenir, diagnosticar o tratar, y está formada por **principio activo + excipientes**.",
"Usa siempre el **nombre genérico (DCI)**: es universal, no cambia con la marca y sus terminaciones orientan sobre el grupo: -olol, -pril, -sartán, -azepam, -prazol.",
"Las siglas del envase dicen cómo se puede usar: **H** uso hospitalario, **DH** diagnóstico hospitalario, **ECM** especial control médico, **TLD** tratamiento de larga duración, **EFP** sin receta y publicitario.",
"De miles de moléculas candidatas llega al mercado una. La **fase IV** (farmacovigilancia) empieza cuando el medicamento ya se vende.",
"La **vía de administración** decide la rapidez, la biodisponibilidad y el riesgo: la intravenosa es la más rápida y la que menos errores perdona."],
grupos:[
{n:"Tipos de medicamentos", mec:"Según cómo se elaboran: **fórmula magistral** (preparada para un paciente concreto por prescripción), **preparado oficinal** (elaborado según el Formulario Nacional) y **especialidad farmacéutica** (fabricada industrialmente y registrada).", ej:["Fórmula magistral","Preparado oficinal","Especialidad farmacéutica","Medicamento genérico (EFG)"], clave:"Un genérico (EFG) tiene el mismo principio activo, dosis y forma que el original y ha demostrado **bioequivalencia**."},
{n:"Nomenclatura", mec:"Un mismo fármaco tiene tres nombres: **químico** (describe la molécula), **genérico o DCI** (internacional) y **comercial** (la marca, con ®).", ej:["-olol: betabloqueantes","-pril: IECA","-sartán: ARA II","-azepam: benzodiacepinas","-prazol: IBP","-mab: anticuerpos monoclonales"], clave:"Las terminaciones de la DCI son una pista, no una regla absoluta, pero ayudan mucho a reconocer el grupo."},
{n:"Condiciones de dispensación", mec:"Siglas y símbolos del envase que indican quién puede prescribir y dónde se dispensa.", ej:["H: uso hospitalario","DH: diagnóstico hospitalario","ECM: especial control médico","TLD: larga duración","EFP: publicitario","Estupefacientes y psicótropos"], clave:"Las siglas no son decoración: un medicamento **H** no se dispensa en una farmacia comunitaria."},
{n:"Desarrollo de un medicamento", mec:"Embudo de años de investigación: **preclínica** (laboratorio y animales) y ensayos clínicos en humanos.", ej:["Fase I: voluntarios sanos, seguridad","Fase II: pocos pacientes, dosis y eficacia","Fase III: miles de pacientes, comparación","Fase IV: poscomercialización"], clave:"Las RAM raras (1 de cada 10.000 o menos) suelen descubrirse en **fase IV**: por eso la notificación es tan importante.", alerta:"El triángulo negro invertido ▼ indica un medicamento sujeto a **seguimiento adicional**: cualquier sospecha de RAM debe notificarse."},
{n:"Vías de administración", mec:"**Enterales** (oral, sublingual, rectal), **parenterales** (intravenosa, intramuscular, subcutánea, intradérmica...) y **tópicas** (cutánea, oftálmica, inhalatoria...).", ej:["Oral","Sublingual","Rectal","Intravenosa","Intramuscular","Subcutánea","Inhalatoria","Transdérmica"], clave:"La sublingual y la rectal evitan en gran parte el **efecto de primer paso** hepático; la intravenosa tiene biodisponibilidad del 100 %."}],
alertas:["Antes de administrar, comprueba principio activo, dosis, vía, paciente y hora. Las presentaciones con nombres o envases parecidos son una causa frecuente de errores.","No partas ni tritures formas de liberación modificada (retard, entéricas) sin comprobarlo: puedes provocar una sobredosis o anular el efecto."],
quiz:[
{q:"¿Qué es un excipiente?", o:["El componente que produce el efecto terapéutico","La sustancia sin acción farmacológica que da forma, estabilidad o sabor al medicamento","El nombre comercial del medicamento","Un fármaco en fase de investigación"], c:1, e:"El excipiente no busca un efecto terapéutico, aunque puede causar problemas (alergias, intolerancias): por eso algunos se declaran obligatoriamente."},
{q:"La sigla **DH** en un envase significa que el medicamento:", o:["Solo puede administrarse en el hospital","Requiere diagnóstico hospitalario, aunque se dispense en farmacia comunitaria","Es de dispensación sin receta","Es un estupefaciente"], c:1, e:"DH: el diagnóstico y la prescripción inicial se hacen en el hospital, pero el paciente puede recogerlo en la farmacia. H es el de uso exclusivamente hospitalario."},
{q:"¿En qué fase del desarrollo es más probable detectar por primera vez una RAM muy rara?", o:["Fase preclínica","Fase I","Fase III","Fase IV"], c:3, e:"Los ensayos de fase III incluyen miles de pacientes, demasiado pocos para RAM de 1 por 10.000 o más rara. Aparecen cuando el fármaco lo toman millones: fase IV."},
{q:"Un fármaco cuyo nombre termina en «-sartán» probablemente es:", o:["Un betabloqueante","Un inhibidor de la bomba de protones","Un antagonista del receptor de angiotensina II","Una benzodiacepina"], c:2, e:"Losartán, valsartán, candesartán: ARA II. -olol son betabloqueantes, -prazol IBP y -azepam benzodiacepinas."}]};

TEMAS[2] = {t:"Farmacocinética y farmacodinámica", conceptos:true, fig:"curva", fig2:"potencia",
idea:"La farmacocinética es lo que el cuerpo hace con el fármaco (absorberlo, distribuirlo, metabolizarlo y eliminarlo); la farmacodinámica es lo que el fármaco hace con el cuerpo.",
claves:[
"**ADME**: absorción, distribución, metabolismo y excreción. Cada paso explica una interacción o una RAM.",
"La **biodisponibilidad** es la fracción de la dosis que llega inalterada a la circulación: 100 % por vía intravenosa, menos por vía oral por absorción incompleta y **efecto de primer paso**.",
"Solo la forma **no ionizada** y liposoluble atraviesa membranas. Un ácido débil se absorbe mejor en medio ácido; para eliminarlo, se **alcaliniza la orina**.",
"Solo el fármaco **libre** (no unido a proteínas) actúa y se elimina. Si otro fármaco lo desplaza de la albúmina, su efecto aumenta (warfarina).",
"El **estado estacionario** se alcanza en unas **4-5 semividas**; tras suspender, se tarda lo mismo en eliminar el fármaco.",
"**Eficacia** es el efecto máximo; **potencia**, la dosis necesaria (DE₅₀). Un fármaco con **índice terapéutico estrecho** (digoxina, litio, warfarina, fenitoína) exige vigilar niveles y dosis."],
grupos:[
{n:"Absorción y primer paso", mec:"Paso del fármaco desde el lugar de administración a la sangre. Por vía oral, pasa primero por el hígado a través de la vena porta.", ej:["Nitroglicerina sublingual","Morfina oral frente a intravenosa","Lidocaína (no se da por vía oral)"], clave:"Un fármaco con gran primer paso necesita dosis orales mucho mayores que intravenosas, o una vía que lo evite (sublingual, rectal, transdérmica)."},
{n:"Distribución y volumen de distribución", mec:"Reparto del fármaco por el organismo. El **Vd** relaciona la dosis con la concentración plasmática: un Vd grande indica que el fármaco se acumula en los tejidos.", ej:["Albúmina: fármacos ácidos","Barrera hematoencefálica","Barrera placentaria"], clave:"El Vd sirve para calcular la **dosis de carga**. La hipoalbuminemia (desnutrición, cirrosis) aumenta la fracción libre y el riesgo de toxicidad."},
{n:"Metabolismo hepático", mec:"**Fase I**: oxidación, reducción, hidrólisis, sobre todo por el **citocromo P450**. **Fase II**: conjugación (glucuronidación, glutatión...) que hace la molécula más hidrosoluble.", ej:["Inductores: rifampicina, carbamazepina, hipérico","Inhibidores: claritromicina, fluconazol, pomelo","Paracetamol y glutatión"], clave:"Un **inductor** reduce los niveles del otro fármaco (fallo terapéutico); un **inhibidor** los aumenta (toxicidad). El paracetamol en sobredosis agota el glutatión: antídoto **N-acetilcisteína**."},
{n:"Excreción", mec:"Sobre todo **renal** (filtración, secreción y reabsorción), también biliar, pulmonar y por la leche materna.", ej:["Litio","Digoxina","Aminoglucósidos","Metformina"], clave:"En la insuficiencia renal y en el anciano, los fármacos de eliminación renal se acumulan: hay que ajustar la dosis según la función renal."},
{n:"Semivida y dosificación", mec:"La **semivida (t½)** es el tiempo en que la concentración plasmática se reduce a la mitad. Determina el intervalo entre dosis.", ej:["Estado estacionario: 4-5 t½","Dosis de carga","Dosis de mantenimiento"], clave:"Si un fármaco de semivida larga necesita efecto rápido, se empieza con una **dosis de carga**."},
{n:"Dianas y receptores", mec:"Los fármacos actúan sobre cuatro dianas: **receptores**, **enzimas**, **canales iónicos** y **transportadores**.", ej:["Receptor: salbutamol (β2)","Enzima: enalapril (ECA)","Canal: amlodipino (calcio)","Transportador: furosemida, ISRS"], clave:"Los receptores pueden ser canales iónicos, acoplados a proteína G, con actividad enzimática o nucleares (corticoides)."},
{n:"Agonistas y antagonistas", mec:"El **agonista** se une y activa el receptor (afinidad + actividad intrínseca); el **antagonista** se une pero no lo activa.", ej:["Agonista puro: morfina","Agonista parcial: buprenorfina","Antagonista competitivo: naloxona","Antagonista no competitivo"], clave:"El antagonista **competitivo** desplaza la curva a la derecha (se supera con más agonista); el **no competitivo** reduce el efecto máximo."}],
alertas:["En pacientes con fármacos de **margen estrecho** (digoxina, litio, warfarina, fenitoína, aminoglucósidos), cualquier fármaco nuevo es una posible interacción: compruébalo.","El zumo de pomelo inhibe el CYP3A4 intestinal: puede aumentar los niveles de algunas estatinas, antagonistas del calcio o inmunosupresores."],
enlaces:"Seminario de cálculo y farmacocinética; seminario de interacciones.",
quiz:[
{q:"Un fármaco tiene una biodisponibilidad oral del 25 %. Si por vía intravenosa la dosis es de 50 mg, ¿qué dosis oral daría una exposición similar?", o:["12,5 mg","50 mg","100 mg","200 mg"], c:3, e:"Solo llega a la circulación un 25 % de lo que se toma por boca: 200 mg × 0,25 = 50 mg disponibles."},
{q:"¿Por qué se alcaliniza la orina en una intoxicación por salicilatos?", o:["Para aumentar su absorción intestinal","Porque así el ácido débil se ioniza en el túbulo y no se reabsorbe","Para inhibir su metabolismo hepático","Para aumentar su unión a proteínas"], c:1, e:"En medio alcalino, un ácido débil está ionizado, no atraviesa la membrana tubular y queda atrapado en la orina."},
{q:"Un paciente estable con warfarina empieza a tomar un fármaco que la desplaza de la albúmina. ¿Qué cabe esperar?", o:["Menor efecto anticoagulante","Mayor fracción libre y mayor riesgo de sangrado","Ningún cambio, porque la dosis es la misma","Mayor eliminación renal sin cambio de efecto"], c:1, e:"Solo actúa el fármaco libre. Si aumenta la fracción libre de un fármaco de margen estrecho, aumenta su efecto: riesgo hemorrágico."},
{q:"El fármaco A alcanza un efecto máximo del 100 % con una DE₅₀ de 10 mg; el B, un 60 % con una DE₅₀ de 1 mg. Es correcto que:", o:["A es más potente y más eficaz","B es más potente, pero A es más eficaz","B es más potente y más eficaz","Ambos tienen la misma eficacia"], c:1, e:"Potencia = menor dosis para el 50 % del efecto (B). Eficacia = mayor efecto máximo (A)."},
{q:"¿Cuánto tarda aproximadamente un fármaco en alcanzar el estado estacionario con dosis repetidas?", o:["Una semivida","Dos semividas","Cuatro o cinco semividas","Diez semividas"], c:2, e:"Tras 4-5 semividas se alcanza más del 94-97 % del estado estacionario. Por eso, en fármacos de semivida larga, se usa una dosis de carga."}]};

TEMAS[3] = {t:"Reacciones adversas a los medicamentos", conceptos:true, fig:"ram",
idea:"Una reacción adversa es cualquier respuesta nociva y no intencionada a un medicamento. Detectarla y notificarla es una obligación legal de los profesionales sanitarios.",
claves:[
"La mayoría de las RAM son de **tipo A**: dependen de la dosis, son previsibles y se explican por el propio mecanismo del fármaco.",
"Las de **tipo B** (alérgicas e idiosincrásicas) son impredecibles, no dependen de la dosis, son raras y graves, y obligan a **retirar el fármaco**.",
"El **efecto colateral** aparece por el mismo mecanismo en otro órgano (sequedad de boca por un anticolinérgico); el **secundario** es consecuencia del efecto principal (hipopotasemia por un diurético).",
"La **teratogenia** (tipo D) depende del momento: el periodo de organogénesis (semanas 3-8) es el más sensible. La talidomida cambió la farmacovigilancia mundial.",
"Notificar es obligatorio para profesionales sanitarios e industria, y voluntario para la ciudadanía: **tarjeta amarilla** o notificaRAM.es."],
grupos:[
{n:"Tipo A: aumentada", mec:"Exageración del efecto farmacológico conocido. Frecuente, dosis-dependiente, baja mortalidad.", ej:["Hipoglucemia por insulina","Sangrado por anticoagulantes","Bradicardia por betabloqueantes","Sequedad de boca por anticolinérgicos"], clave:"Se maneja **ajustando la dosis**. Más frecuente en ancianos, insuficiencia renal o hepática e interacciones."},
{n:"Tipo B: bizarra", mec:"No relacionada con la acción farmacológica. Dos formas: **alérgica** (inmunológica, requiere exposición previa) e **idiosincrásica** (determinada genéticamente).", ej:["Anafilaxia por penicilina","Hemólisis en el déficit de G6PD","Hipertermia maligna con anestésicos inhalatorios","Agranulocitosis por metamizol"], clave:"Imprevisible, independiente de la dosis, baja incidencia y alta gravedad: **retirar el fármaco** y no volver a administrarlo."},
{n:"Tipos C, D, E y F", mec:"**C**: crónicas, por uso prolongado. **D**: diferidas (carcinogénesis, teratogénesis). **E**: al finalizar el tratamiento. **F**: fallo terapéutico.", ej:["C: Cushing por corticoides","D: focomelia por talidomida","E: rebote al retirar un betabloqueante","F: fallo del anticonceptivo con rifampicina"], clave:"Las de tipo E se previenen retirando de forma **gradual** (betabloqueantes, benzodiacepinas, corticoides, antiepilépticos)."},
{n:"Fármacos a evitar en el embarazo", mec:"Algunos son teratógenos o dañan al feto en el segundo y tercer trimestre.", ej:["IECA y ARA II","Warfarina","Valproato","Isotretinoína","Tetraciclinas","AINE en el tercer trimestre"], clave:"Los AINE en el tercer trimestre pueden cerrar el **ductus arterioso** y reducir el líquido amniótico."},
{n:"Farmacovigilancia", mec:"Detección, evaluación y prevención de las RAM una vez comercializado el medicamento. En España se integra en el Sistema Español de Farmacovigilancia (base de datos **FEDRA**).", ej:["Tarjeta amarilla","notificaRAM.es","Triángulo negro ▼","Algoritmo de Karch-Lasagna"], clave:"Basta la **sospecha** para notificar: no hace falta estar seguro de la relación causal."}],
alertas:["Pregunta siempre por alergias previas y regístralas. Una alergia mal documentada es una RAM evitable.","Ante una RAM grave, no esperes a tener certeza: comunica la sospecha. Sobre todo si el medicamento lleva el triángulo negro ▼ o la reacción no está descrita."],
quiz:[
{q:"La hipoglucemia por una dosis excesiva de insulina es una RAM de tipo:", o:["A","B","D","E"], c:0, e:"Es la exageración del efecto farmacológico conocido y depende de la dosis: tipo A."},
{q:"¿Qué característica corresponde a una RAM de tipo B?", o:["Es frecuente y previsible","Depende de la dosis","Es impredecible, rara y obliga a retirar el fármaco","Aparece al suspender el tratamiento"], c:2, e:"Las RAM tipo B (alérgicas e idiosincrásicas) no dependen de la dosis, son raras, graves e impredecibles."},
{q:"La sequedad de boca que produce un anticolinérgico usado para la vejiga hiperactiva es un ejemplo de:", o:["Efecto secundario","Efecto colateral","Reacción idiosincrásica","Reacción alérgica"], c:1, e:"Es el mismo mecanismo (bloqueo muscarínico) actuando en otro órgano, la glándula salival: efecto colateral."},
{q:"¿Para quién no es obligatoria la notificación de sospechas de RAM?", o:["Médicos y enfermeras","Farmacéuticos","Industria farmacéutica","Ciudadanía"], c:3, e:"Los profesionales sanitarios y la industria están obligados; los ciudadanos pueden notificar de forma voluntaria."},
{q:"El rebote de taquicardia e hipertensión al suspender bruscamente un betabloqueante es una RAM de tipo:", o:["A","C","E","F"], c:2, e:"Tipo E: aparece al finalizar el tratamiento. Se previene retirando de forma gradual."}]};

TEMAS[4] = {t:"Introducción al sistema nervioso autónomo", conceptos:true, fig:"sna", fig2:"cuadricula",
idea:"Todo el bloque sigue el mismo orden: neurotransmisor, receptor, efecto fisiológico y fármaco. Si dominas los receptores, los fármacos se deducen.",
claves:[
"**Parasimpático**: acetilcolina sobre receptores **muscarínicos** del órgano. Reposo y digestión: bradicardia, miosis, secreciones, broncoconstricción, peristaltismo, micción.",
"**Simpático**: noradrenalina sobre receptores **α y β**. Lucha o huida: taquicardia, midriasis, broncodilatación, glucemia alta.",
"En **todos los ganglios** y en la **placa motora**, el receptor es **nicotínico**.",
"**β1 = un corazón, β2 = dos pulmones**: β1 acelera y refuerza el corazón; β2 relaja el bronquio, el útero y la vejiga.",
"La acetilcolinesterasa destruye la acetilcolina en menos de un milisegundo: inhibirla prolonga y generaliza el efecto colinérgico.",
"Las glándulas sudoríparas son simpáticas pero **colinérgicas** (M3): los anticolinérgicos quitan el sudor."],
grupos:[
{n:"Receptores muscarínicos", sub:"Acetilcolina, parasimpático", mec:"**M2** en el corazón: frena (bradicardia, bloqueo AV). **M3** en músculo liso y glándulas: contrae y secreta.", ej:["M2: corazón","M3: bronquio, intestino, vejiga","M3: pupila (miosis)","M3: glándulas salivales, lagrimales y sudoríparas"], clave:"Síndrome colinérgico, **DUMBELS**: diarrea, urinación, miosis, broncorrea y broncoespasmo, emesis, lagrimeo, salivación y sudoración."},
{n:"Receptores nicotínicos", sub:"Acetilcolina, ganglios y músculo", mec:"Canales iónicos en los **ganglios autónomos** (simpáticos y parasimpáticos), la médula suprarrenal y la **placa motora**.", ej:["Ganglios autónomos","Médula suprarrenal","Placa motora del músculo esquelético"], clave:"Los bloqueantes neuromusculares (Tema 12) son antagonistas nicotínicos de la placa motora."},
{n:"Receptores α", sub:"Noradrenalina, simpático", mec:"**α1** contrae: vasos (piel, vísceras), esfínteres, músculo radial del iris (midriasis). **α2** presináptico: frena la liberación de noradrenalina; en el páncreas reduce la insulina.", ej:["α1: vasoconstricción","α1: esfínter vesical","α2: freno presináptico"], clave:"Agonista α1 = sube la tensión; antagonista α1 = la baja y relaja la próstata."},
{n:"Receptores β", sub:"Noradrenalina y adrenalina", mec:"**β1**: corazón (frecuencia y fuerza) y riñón (renina). **β2**: relaja el bronquio, el útero, la vejiga y dilata los vasos del músculo. **β3**: lipólisis y relajación del detrusor.", ej:["β1: corazón","β2: bronquio","β2: útero","β3: tejido adiposo y vejiga"], clave:"Un betabloqueante no selectivo puede producir broncoespasmo en un asmático porque también bloquea β2."}],
alertas:["El simpático sube la glucemia y sus síntomas (temblor, taquicardia, sudor) avisan de la hipoglucemia. Un diabético con betabloqueante se recupera peor y la nota menos.","Síndrome anticolinérgico: «seco como un hueso, rojo como una remolacha, ciego como un topo, loco como una cabra y caliente como un horno», con taquicardia y retención urinaria."],
quiz:[
{q:"¿Qué receptor media la bradicardia por estimulación parasimpática?", o:["M1","M2","M3","Nicotínico"], c:1, e:"El receptor M2 del nodo sinusal y AV frena el corazón."},
{q:"¿Cuál es el receptor de la acetilcolina en los ganglios simpáticos?", o:["Muscarínico M3","α1","Nicotínico","β1"], c:2, e:"En todos los ganglios autónomos, simpáticos y parasimpáticos, la acetilcolina actúa sobre receptores nicotínicos."},
{q:"La broncodilatación simpática se debe a la activación de receptores:", o:["α1","α2","β1","β2"], c:3, e:"β2 relaja el músculo liso bronquial: «dos pulmones»."},
{q:"¿Por qué un anticolinérgico reduce la sudoración si las glándulas sudoríparas están inervadas por el simpático?", o:["Porque bloquea los receptores α1 de la glándula","Porque la fibra simpática de la glándula libera acetilcolina sobre receptores M3","Porque reduce la temperatura corporal","Porque bloquea los ganglios simpáticos"], c:1, e:"Es la excepción del sistema: inervación simpática colinérgica muscarínica (M3)."},
{q:"El síntoma «DUMBELS» describe:", o:["El síndrome anticolinérgico","El síndrome colinérgico","La crisis hipertensiva","El síndrome serotoninérgico"], c:1, e:"Diarrea, urinación, miosis, broncorrea, emesis, lagrimeo, salivación: exceso de acetilcolina, por ejemplo en una intoxicación por organofosforados."}]};

TEMAS[5] = {t:"Fármacos parasimpaticomiméticos",
idea:"Imitan al parasimpático de dos formas: activando directamente el receptor muscarínico o frenando la enzima que destruye la acetilcolina.",
claves:[
"**Directos**: agonistas muscarínicos poco selectivos; se usan sobre todo por vía tópica (pilocarpina en colirio) o para la retención urinaria (betanecol).",
"**Indirectos o anticolinesterásicos**: aumentan la acetilcolina en todas las sinapsis, también en la placa motora y, si atraviesan la barrera, en el cerebro.",
"La **neostigmina** y la **piridostigmina** no entran en el cerebro (cuaternarias); la **fisostigmina** sí, por eso es el antídoto de la intoxicación anticolinérgica.",
"Los anticolinesterásicos de acción central (**donepezilo, rivastigmina, galantamina**) se usan en el Alzheimer.",
"Los **organofosforados** (insecticidas, gases nerviosos) inhiben la enzima de forma irreversible: atropina y pralidoxima."],
grupos:[
{n:"Agonistas muscarínicos directos", mec:"Activan los receptores muscarínicos imitando a la acetilcolina.", ej:["Pilocarpina","Betanecol","Carbacol"], clave:"Pilocarpina: glaucoma (miosis que abre la salida del humor acuoso) y sequedad de boca. Betanecol: retención urinaria no obstructiva.", alerta:"Contraindicados en asma, bradicardia, obstrucción urinaria o intestinal y úlcera péptica."},
{n:"Anticolinesterásicos reversibles periféricos", mec:"Inhiben la acetilcolinesterasa; no atraviesan la barrera hematoencefálica.", ej:["Neostigmina","Piridostigmina","Edrofonio"], clave:"Miastenia gravis (piridostigmina) y reversión del bloqueo neuromuscular no despolarizante tras la cirugía (neostigmina, junto con atropina para frenar el efecto muscarínico)."},
{n:"Anticolinesterásicos centrales", mec:"Atraviesan la barrera y aumentan la acetilcolina cerebral.", ej:["Donepezilo","Rivastigmina","Galantamina","Fisostigmina"], clave:"Alzheimer leve-moderado: mejoría modesta de la cognición. RAM: náuseas, diarrea, **bradicardia** y síncope. La rivastigmina existe en parche.", alerta:"En un anciano con donepezilo, vigila la frecuencia cardiaca y las caídas, sobre todo si también toma betabloqueantes."},
{n:"Anticolinesterásicos irreversibles", mec:"Fosforilan la enzima de forma permanente.", ej:["Organofosforados (insecticidas)","Gases nerviosos (sarín)"], clave:"Intoxicación: síndrome colinérgico muscarínico (DUMBELS), nicotínico (fasciculaciones, debilidad) y central. Tratamiento: **atropina** a dosis altas y **pralidoxima** precoz."}],
alertas:["Signos de exceso colinérgico: bradicardia, broncoespasmo, sudoración, salivación, diarrea y calambres abdominales.","En la intoxicación por organofosforados, protégete: la ropa y la piel del paciente están contaminadas."],
enlaces:"Tema 6 (atropina como antídoto) y Tema 12 (reversión del bloqueo neuromuscular).",
quiz:[
{q:"¿Por qué la fisostigmina sirve como antídoto de una intoxicación anticolinérgica con delirio y la neostigmina no?", o:["Porque la fisostigmina es irreversible","Porque la fisostigmina atraviesa la barrera hematoencefálica","Porque la neostigmina es un agonista directo","Porque la neostigmina solo actúa en el corazón"], c:1, e:"La neostigmina es una amina cuaternaria que no entra en el cerebro; la fisostigmina sí puede revertir el delirio central."},
{q:"¿Qué fármaco se usa en la miastenia gravis?", o:["Piridostigmina","Atropina","Pilocarpina","Pralidoxima"], c:0, e:"La piridostigmina aumenta la acetilcolina en la placa motora y mejora la fuerza muscular."},
{q:"¿Cuál de estos efectos es esperable con donepezilo?", o:["Taquicardia y estreñimiento","Bradicardia y diarrea","Retención urinaria y sequedad de boca","Midriasis"], c:1, e:"Al aumentar la acetilcolina predominan los efectos muscarínicos: bradicardia, náuseas, diarrea."},
{q:"El tratamiento de una intoxicación por un insecticida organofosforado incluye:", o:["Neostigmina y fisostigmina","Atropina y pralidoxima","Adrenalina y naloxona","Flumazenilo"], c:1, e:"La atropina bloquea el exceso muscarínico y la pralidoxima reactiva la enzima si se da pronto."}]};

TEMAS[6] = {t:"Fármacos parasimpaticolíticos",
idea:"Bloquean los receptores muscarínicos. No hace falta memorizar sus efectos: son exactamente los contrarios a los del parasimpático.",
claves:[
"Son **antagonistas competitivos muscarínicos**: midriasis en lugar de miosis, taquicardia en lugar de bradicardia, sequedad en lugar de secreción, retención en lugar de micción.",
"La **atropina** se usa en la bradicardia sintomática, en la preanestesia y en la intoxicación por organofosforados.",
"La **butilescopolamina** no atraviesa la barrera: espasmolítico abdominal sin efectos centrales. La **escopolamina** sí: cinetosis.",
"Por vía inhalada (**ipratropio, tiotropio**) son broncodilatadores en la EPOC; en el ojo (**tropicamida**), midriáticos para explorar.",
"En ancianos, la **carga anticolinérgica** acumulada produce confusión, caídas, estreñimiento y retención urinaria."],
grupos:[
{n:"Atropina", mec:"Antagonista muscarínico no selectivo.", ej:["Atropina"], clave:"Bradicardia sintomática, preanestesia (reduce secreciones), antídoto de organofosforados y de setas muscarínicas.", alerta:"Puede desencadenar un glaucoma agudo de ángulo cerrado y retención urinaria en la hiperplasia de próstata."},
{n:"Escopolamina y butilescopolamina", mec:"La escopolamina actúa en el SNC; la butilescopolamina (cuaternaria) solo en la periferia.", ej:["Escopolamina","Butilescopolamina"], clave:"Escopolamina en parche: cinetosis. Butilescopolamina: cólico biliar, renal o intestinal."},
{n:"Antimuscarínicos inhalados", mec:"Bloquean el tono vagal broncoconstrictor.", ej:["Ipratropio","Tiotropio","Glicopirronio","Umeclidinio"], clave:"Ipratropio: acción corta (crisis, junto a salbutamol). Tiotropio: acción larga, una vez al día, mantenimiento de la EPOC."},
{n:"Antimuscarínicos urinarios", mec:"Relajan el detrusor de la vejiga.", ej:["Oxibutinina","Tolterodina","Solifenacina","Fesoterodina"], clave:"Vejiga hiperactiva e incontinencia de urgencia. RAM: sequedad de boca, estreñimiento, visión borrosa; la oxibutinina puede producir confusión en ancianos."},
{n:"Antimuscarínicos oftálmicos", mec:"Producen midriasis y cicloplejía (parálisis de la acomodación).", ej:["Tropicamida","Ciclopentolato","Atropina colirio"], clave:"Exploración del fondo de ojo. Tras la prueba, el paciente verá borroso y le molestará la luz: no debe conducir."}],
alertas:["Síndrome anticolinérgico: piel seca y roja, midriasis, fiebre, confusión, taquicardia, retención urinaria e íleo. Antídoto: fisostigmina en casos graves.","Revisa la carga anticolinérgica en ancianos: antihistamínicos de primera generación, tricíclicos, antimuscarínicos urinarios, antipsicóticos... se suman."],
quiz:[
{q:"¿Qué efecto NO esperarías con atropina?", o:["Midriasis","Taquicardia","Sequedad de boca","Miosis"], c:3, e:"La atropina bloquea el parasimpático: produce midriasis, no miosis."},
{q:"Para un cólico renal sin efectos sobre el SNC, el antimuscarínico más adecuado es:", o:["Escopolamina","Butilescopolamina","Atropina","Tiotropio"], c:1, e:"La butilescopolamina es cuaternaria: no atraviesa la barrera hematoencefálica."},
{q:"¿En qué paciente debe usarse con precaución un antimuscarínico?", o:["Hombre de 75 años con hiperplasia benigna de próstata","Joven con diarrea del viajero","Paciente con sialorrea","Paciente con bradicardia sinusal"], c:0, e:"El bloqueo muscarínico relaja el detrusor y puede precipitar una retención urinaria aguda en la hiperplasia de próstata."},
{q:"El tiotropio se usa principalmente en:", o:["La crisis asmática grave","El mantenimiento de la EPOC","La vejiga hiperactiva","El glaucoma"], c:1, e:"Es un antimuscarínico inhalado de acción larga, pilar del mantenimiento de la EPOC."}]};

TEMAS[7] = {t:"Fármacos simpaticomiméticos",
idea:"Imitan al simpático activando receptores α, β o ambos. Su utilidad y sus riesgos dependen de qué receptor encienden.",
claves:[
"**α1** (fenilefrina, oximetazolina): vasoconstricción. Descongestionantes nasales, nunca más de **3-5 días** por la rinitis medicamentosa.",
"**β1** (dobutamina): aumenta la fuerza del corazón en el shock cardiogénico.",
"**β2** de acción corta (salbutamol): rescate en el asma. De acción larga (salmeterol, formoterol): mantenimiento, **nunca solos en el asma**.",
"**Adrenalina** (α + β): fármaco de la anafilaxia por vía **intramuscular** en el muslo, y de la parada cardiaca por vía intravenosa.",
"**Noradrenalina**: vasopresor del shock; por vía central, porque la extravasación produce necrosis."],
grupos:[
{n:"Agonistas α1", mec:"Contraen el músculo liso vascular.", ej:["Fenilefrina","Oximetazolina","Xilometazolina","Nafazolina"], clave:"Descongestionantes nasales y oftálmicos; midriático (fenilefrina colirio). Por vía sistémica, vasopresor.", alerta:"Rinitis medicamentosa con el uso prolongado: rebote de congestión al suspender. Máximo 3-5 días."},
{n:"Agonistas α2", mec:"Activan el freno presináptico central y reducen el tono simpático.", ej:["Clonidina","Brimonidina","Dexmedetomidina"], clave:"Clonidina: antihipertensivo central (rebote si se suspende bruscamente). Brimonidina: glaucoma. Dexmedetomidina: sedación en UCI."},
{n:"Agonistas β1", mec:"Aumentan la contractilidad y la frecuencia cardiaca.", ej:["Dobutamina"], clave:"Shock cardiogénico y bajo gasto. Perfusión continua con monitorización: taquicardia y arritmias."},
{n:"Agonistas β2", mec:"Relajan el músculo liso bronquial (y uterino).", ej:["Salbutamol","Terbutalina","Salmeterol","Formoterol"], clave:"Acción corta: rescate. Acción larga: mantenimiento, siempre con un corticoide inhalado en el asma. RAM: temblor, taquicardia, **hipopotasemia**.", alerta:"Un asmático que usa el inhalador de rescate más de dos veces por semana tiene el asma mal controlada."},
{n:"Agonistas mixtos", mec:"Actúan sobre α y β (directos) o liberan noradrenalina (indirectos).", ej:["Adrenalina","Noradrenalina","Dopamina","Efedrina","Pseudoefedrina"], clave:"Adrenalina IM (ampolla 1 mg/mL): anafilaxia, 0,5 mg en el adulto en la cara externa del muslo. Noradrenalina: shock séptico. Pseudoefedrina: descongestionante oral, sube la tensión.", alerta:"Si se extravasa noradrenalina o dopamina: necrosis local. Antídoto: **fentolamina** infiltrada."}],
alertas:["Confundir la ampolla de adrenalina 1:1000 (para vía IM) con la dilución intravenosa es un error grave y documentado.","Los descongestionantes con pseudoefedrina (antigripales) suben la tensión: precaución en hipertensos y cardiópatas."],
quiz:[
{q:"¿Cuál es la vía de elección de la adrenalina en una anafilaxia fuera de una parada cardiaca?", o:["Intravenosa en bolo","Intramuscular en la cara externa del muslo","Subcutánea en el brazo","Inhalada"], c:1, e:"La vía intramuscular en el muslo consigue niveles rápidos y es la más segura fuera de una parada."},
{q:"Un paciente usa oximetazolina nasal desde hace dos meses y cada vez está más congestionado. ¿Qué ocurre?", o:["Alergia al fármaco","Rinitis medicamentosa por efecto rebote","Infección por el aplicador","Tolerancia a los corticoides"], c:1, e:"El uso prolongado de vasoconstrictores α1 produce congestión de rebote. Máximo 3-5 días."},
{q:"¿Qué RAM es típica de dosis altas de salbutamol?", o:["Bradicardia","Hiperpotasemia","Temblor e hipopotasemia","Broncoespasmo"], c:2, e:"El β2 introduce potasio en las células y produce temblor y taquicardia."},
{q:"En el asma, un β2 de acción larga (salmeterol, formoterol) debe usarse:", o:["Solo, como rescate","Siempre combinado con un corticoide inhalado","Únicamente por vía oral","Solo en niños"], c:1, e:"En monoterapia aumenta el riesgo de crisis graves; siempre con corticoide inhalado."}]};

TEMAS[8] = {t:"Fármacos simpaticolíticos",
idea:"Bloquean los receptores adrenérgicos. Los alfabloqueantes relajan vasos y próstata; los betabloqueantes frenan el corazón y protegen tras un infarto.",
claves:[
"**α1-bloqueantes**: doxazosina (hipertensión) y tamsulosina (hiperplasia benigna de próstata). Primera dosis al acostarse: **hipotensión ortostática**.",
"**Betabloqueantes**: cardioselectivos β1 (atenolol, bisoprolol, metoprolol, nebivolol) y no selectivos (propranolol, timolol); carvedilol y labetalol bloquean también α1.",
"Indicaciones: hipertensión, angina, arritmias, **insuficiencia cardiaca** (bisoprolol, carvedilol, metoprolol, nebivolol), posinfarto, migraña, temblor esencial y glaucoma (timolol).",
"RAM: bradicardia, hipotensión, broncoespasmo (sobre todo los no selectivos), fatiga, frialdad de extremidades, y **enmascaran la hipoglucemia**.",
"**Nunca se suspenden de golpe**: rebote con taquicardia, angina o infarto."],
grupos:[
{n:"Antagonistas α1", mec:"Bloquean la vasoconstricción α1 y relajan el músculo liso de la próstata y el cuello vesical.", ej:["Doxazosina","Prazosina","Tamsulosina","Silodosina","Alfuzosina"], clave:"Doxazosina: hipertensión. Tamsulosina y silodosina (uroselectivas): hiperplasia benigna de próstata.", alerta:"Hipotensión ortostática de primera dosis: tomarla al acostarse. Avisar al oftalmólogo antes de una cirugía de cataratas (síndrome del iris flácido con tamsulosina)."},
{n:"Betabloqueantes cardioselectivos", mec:"Bloquean preferentemente β1: menos frecuencia, contractilidad y renina.", ej:["Atenolol","Bisoprolol","Metoprolol","Nebivolol"], clave:"Preferibles en asma o EPOC si un betabloqueante es necesario, aunque la selectividad se pierde a dosis altas."},
{n:"Betabloqueantes no selectivos", mec:"Bloquean β1 y β2.", ej:["Propranolol","Timolol","Sotalol"], clave:"Propranolol: temblor esencial, migraña, síntomas somáticos de ansiedad, hipertiroidismo. Timolol colirio: glaucoma (puede absorberse y dar bradicardia).", alerta:"Contraindicados en el asma: broncoespasmo."},
{n:"Bloqueantes α y β", mec:"Bloquean β y además α1 (vasodilatación).", ej:["Carvedilol","Labetalol"], clave:"Carvedilol: insuficiencia cardiaca e hipertensión. Labetalol: hipertensión del embarazo."}],
alertas:["Antes de dar un betabloqueante, mide la frecuencia cardiaca y la tensión: si la frecuencia está por debajo de 50-55 lpm o hay hipotensión, consulta.","En un diabético con insulina y betabloqueante, enseña que la sudoración sigue avisando de la hipoglucemia aunque no note el temblor ni la taquicardia."],
enlaces:"Bloque VIII: betabloqueantes como antiarrítmicos, antianginosos y antihipertensivos.",
quiz:[
{q:"¿Qué consejo darías a un paciente que empieza con doxazosina?", o:["Tomarla en ayunas por la mañana","Tomar la primera dosis al acostarse por el riesgo de hipotensión ortostática","Suspenderla si nota mareo, sin consultar","Tomarla con zumo de pomelo"], c:1, e:"El efecto de primera dosis puede producir mareo y síncope al levantarse."},
{q:"¿Qué betabloqueante evitarías en un paciente asmático?", o:["Bisoprolol","Nebivolol","Propranolol","Metoprolol"], c:2, e:"El propranolol es no selectivo: bloquea β2 bronquiales y puede desencadenar broncoespasmo."},
{q:"¿Por qué no debe suspenderse bruscamente un betabloqueante?", o:["Porque produce hipoglucemia","Por el rebote: taquicardia, hipertensión, angina o infarto","Porque produce broncoespasmo","Porque aparece una reacción alérgica"], c:1, e:"Los receptores β aumentan durante el tratamiento: al retirar el fármaco, la estimulación simpática es excesiva."},
{q:"¿Cuál de estos fármacos está indicado en la hiperplasia benigna de próstata?", o:["Tamsulosina","Atenolol","Fenilefrina","Clonidina"], c:0, e:"La tamsulosina bloquea α1 de la próstata y el cuello vesical y mejora el flujo urinario."}]};

TEMAS[9] = {t:"Histamina y antihistamínicos",
idea:"La histamina es un mediador local, liberado sobre todo por mastocitos y basófilos. Sus efectos dependen del receptor: H1 pica, H2 quema, H3 despierta.",
claves:[
"Un **autacoide** actúa donde se produce y dura poco: es «gritarle al vecino», no enviar una carta por la sangre como una hormona.",
"**H1**: picor, vasodilatación, aumento de la permeabilidad (habón, edema) y broncoconstricción. Es la base de la urticaria, la rinitis alérgica y parte de la anafilaxia.",
"**H2**: secreción de ácido gástrico. **H3**: receptor presináptico del SNC que regula la vigilia.",
"Los antihistamínicos de **primera generación** atraviesan la barrera y son anticolinérgicos: sedan. Los de **segunda generación** apenas entran en el cerebro.",
"La anafilaxia se trata con **adrenalina intramuscular**. El antihistamínico es un complemento, nunca el tratamiento principal."],
grupos:[
{n:"Antihistamínicos H1 de primera generación", mec:"Bloquean H1 y además receptores muscarínicos, α y serotoninérgicos; atraviesan la barrera hematoencefálica.", ej:["Dexclorfeniramina","Difenhidramina","Hidroxizina","Doxilamina","Prometazina","Dimenhidrinato"], clave:"Útiles cuando interesa sedar o en la cinetosis; la doxilamina se vende como hipnótico y, con piridoxina, para los vómitos del embarazo.", alerta:"Somnolencia: no conducir. En ancianos, confusión, caídas y retención urinaria: evitarlos."},
{n:"Antihistamínicos H1 de segunda generación", mec:"Bloqueo H1 selectivo, sin apenas paso al SNC ni efecto anticolinérgico.", ej:["Loratadina","Desloratadina","Cetirizina","Levocetirizina","Ebastina","Bilastina","Rupatadina","Fexofenadina"], clave:"Primera elección en la rinitis alérgica y la urticaria. La cetirizina puede sedar algo a dosis altas."},
{n:"Antihistamínicos H2", mec:"Bloquean el receptor H2 de la célula parietal y reducen el ácido gástrico.", ej:["Famotidina","Cimetidina"], clave:"Hoy se usan menos que los IBP. La ranitidina se retiró en 2020. La cimetidina es inhibidora enzimática y puede producir ginecomastia."}],
alertas:["En una reacción alérgica grave con dificultad respiratoria o hipotensión: adrenalina IM en el muslo, sin esperar a que haga efecto el antihistamínico.","Revisa los antigripales y los hipnóticos sin receta: muchos llevan antihistamínicos de primera generación."],
quiz:[
{q:"¿Qué receptor de la histamina media la secreción de ácido gástrico?", o:["H1","H2","H3","H4"], c:1, e:"H2 en la célula parietal: por eso la famotidina reduce el ácido."},
{q:"¿Qué diferencia principal tienen los antihistamínicos de segunda generación respecto a los de primera?", o:["Son más potentes sobre H2","Apenas atraviesan la barrera hematoencefálica y no son anticolinérgicos","Se administran solo por vía intravenosa","Tratan la anafilaxia mejor que la adrenalina"], c:1, e:"La innovación fue aprender a no entrar en el cerebro, perdiendo la sedación y los efectos anticolinérgicos."},
{q:"Ante una anafilaxia con estridor e hipotensión, el primer fármaco es:", o:["Dexclorfeniramina intravenosa","Adrenalina intramuscular","Hidrocortisona intravenosa","Salbutamol inhalado"], c:1, e:"La adrenalina revierte la vasodilatación, el edema y el broncoespasmo. Antihistamínico y corticoide son complementarios."},
{q:"¿Qué antihistamínico evitarías en un anciano con hiperplasia de próstata y caídas?", o:["Bilastina","Loratadina","Difenhidramina","Desloratadina"], c:2, e:"Es de primera generación: sedante y anticolinérgico (confusión, retención urinaria, caídas)."}]};

TEMAS[10] = {t:"Serotonina, antiserotoninérgicos y migraña",
idea:"La serotonina regula el intestino, las plaquetas, los vasos y el cerebro. En la migraña, los triptanes estimulan receptores 5-HT1 para cerrar los vasos craneales y frenar la inflamación neurogénica.",
claves:[
"El **95 % de la serotonina** está en el intestino (células enterocromafines), no en el cerebro.",
"Receptores clave: **5-HT1B/1D** (vasos craneales y terminales del trigémino), **5-HT3** (vómito) y **5-HT4** (motilidad intestinal).",
"Los **triptanes** se toman **al inicio del dolor** de la crisis de migraña, no como prevención.",
"El triptán cierra vasos craneales… y también coronarios: contraindicado en **cardiopatía isquémica** e hipertensión no controlada.",
"Tomar analgésicos más de 10-15 días al mes produce **cefalea por abuso de medicación**: ahí está indicada la profilaxis."],
grupos:[
{n:"Triptanes (agonistas 5-HT1B/1D)", mec:"Vasoconstricción craneal e inhibición de la liberación de neuropéptidos inflamatorios (CGRP) en el trigémino.", ej:["Sumatriptán","Rizatriptán","Zolmitriptán","Almotriptán","Eletriptán"], clave:"Tratamiento de la crisis moderada-grave. Vía oral, nasal o subcutánea (sumatriptán).", alerta:"No en cardiopatía isquémica, ictus previo ni hipertensión no controlada. Opresión torácica transitoria tras la dosis: frecuente, pero hay que valorarla."},
{n:"Analgésicos de la crisis", mec:"AINE o paracetamol, a menudo con un antiemético procinético.", ej:["Ibuprofeno","Naproxeno","Ácido acetilsalicílico","Paracetamol","Metoclopramida"], clave:"Primer escalón en la crisis leve-moderada. El antiemético mejora además la absorción."},
{n:"Profilaxis de la migraña", mec:"Fármacos de distintos grupos que reducen la frecuencia de las crisis.", ej:["Propranolol","Topiramato","Amitriptilina","Flunarizina","Erenumab","Galcanezumab"], clave:"Indicada con crisis frecuentes o muy incapacitantes. Los anticuerpos anti-CGRP (erenumab, galcanezumab, fremanezumab) se reservan para casos refractarios."},
{n:"Antagonistas 5-HT3", mec:"Bloquean la serotonina en la zona gatillo del vómito y en el intestino.", ej:["Ondansetrón","Granisetrón"], clave:"Vómitos por quimioterapia y postoperatorios. RAM: estreñimiento, cefalea, prolongación del QT."}],
alertas:["Pregunta cuántos días al mes toma analgésicos un paciente con migraña: más de 10-15 sugiere cefalea por abuso de medicación.","Combinar triptanes con ISRS o IRSN tiene un riesgo teórico de síndrome serotoninérgico: vigila agitación, temblor y fiebre."],
quiz:[
{q:"¿Dónde se encuentra la mayor parte de la serotonina del organismo?", o:["En el cerebro","En las plaquetas","En el intestino","En los riñones"], c:2, e:"Alrededor del 95 % está en las células enterocromafines del tubo digestivo."},
{q:"¿Cuándo debe tomarse un triptán?", o:["A diario como prevención","Al inicio del dolor de la crisis","Solo durante el aura, antes del dolor","Una vez pasada la crisis"], c:1, e:"Es un tratamiento sintomático de la crisis; funciona mejor cuanto antes se tome, una vez ha empezado el dolor."},
{q:"¿En qué paciente está contraindicado el sumatriptán?", o:["Mujer joven con migraña con aura","Hombre con angina de pecho","Paciente con asma","Paciente con hipotiroidismo"], c:1, e:"La vasoconstricción por 5-HT1B también afecta a las coronarias: contraindicado en la cardiopatía isquémica."},
{q:"Un paciente toma analgésicos 20 días al mes por migraña. ¿Qué problema sospechas?", o:["Alergia a los AINE","Cefalea por abuso de medicación","Migraña con aura","Síndrome serotoninérgico"], c:1, e:"El uso frecuente de analgésicos cronifica la cefalea; se trata retirándolos y con profilaxis."}]};

TEMAS[11] = {t:"Anestésicos locales",
idea:"Bloquean los canales de sodio del nervio y detienen la conducción del impulso. Primero se pierde el dolor y la temperatura; después, el tacto y la fuerza.",
claves:[
"Son **bases débiles**: la forma no ionizada atraviesa la membrana y la ionizada bloquea el canal de sodio desde dentro.",
"En un **tejido inflamado o un absceso** (pH ácido) funcionan peor: se ionizan antes de entrar en el nervio.",
"**Ésteres** (procaína, tetracaína, benzocaína): más alergias. **Amidas** (lidocaína, mepivacaína, bupivacaína, ropivacaína, articaína): metabolismo hepático, más usadas. Pista: las amidas llevan dos «i» en el nombre.",
"Con **adrenalina**: dura más, sangra menos y se absorbe menos. Precaución en zonas acras (dedos, pene, nariz, orejas).",
"Toxicidad sistémica: primero **SNC** (hormigueo peribucal, sabor metálico, acúfenos, convulsiones) y después corazón (arritmias). Tratamiento: **emulsión lipídica al 20 %**."],
grupos:[
{n:"Amidas", mec:"Bloqueo de canales de sodio; metabolismo hepático.", ej:["Lidocaína","Mepivacaína","Bupivacaína","Levobupivacaína","Ropivacaína","Articaína","Prilocaína"], clave:"Lidocaína: infiltración, tópica y antiarrítmico. Bupivacaína: larga duración, la más cardiotóxica. EMLA (lidocaína + prilocaína): crema antes de una venopunción en niños.", alerta:"La prilocaína y la benzocaína pueden producir metahemoglobinemia, sobre todo en lactantes."},
{n:"Ésteres", mec:"Bloqueo de canales de sodio; los hidrolizan las colinesterasas plasmáticas.", ej:["Procaína","Tetracaína","Benzocaína","Cocaína"], clave:"Más reacciones alérgicas (metabolito PABA). Hoy se usan sobre todo por vía tópica (tetracaína en colirio, benzocaína en mucosas)."}],
alertas:["Aspira antes de inyectar para no administrar el anestésico en un vaso.","Si el paciente refiere hormigueo alrededor de la boca, sabor metálico o zumbido de oídos tras una infiltración, detén la administración y avisa: son los primeros signos de toxicidad.","La crema EMLA necesita unos 60 minutos bajo oclusión para hacer efecto."],
quiz:[
{q:"¿Por qué un anestésico local funciona mal al drenar un absceso?", o:["Porque el pus lo inactiva químicamente","Porque el pH ácido lo ioniza y le impide atravesar la membrana del nervio","Porque el absceso tiene más nervios","Porque la inflamación acelera su metabolismo hepático"], c:1, e:"Es una base débil: en medio ácido predomina la forma ionizada, que no atraviesa la membrana."},
{q:"¿Cuál es el primer signo de toxicidad sistémica por anestésicos locales?", o:["Bradicardia","Hormigueo peribucal y sabor metálico","Hipertermia","Exantema"], c:1, e:"La toxicidad empieza en el SNC (parestesias peribucales, acúfenos) antes que la cardiovascular."},
{q:"¿Qué ventaja tiene añadir adrenalina al anestésico local?", o:["Acelera su eliminación","Prolonga el efecto y reduce el sangrado y la absorción","Evita las reacciones alérgicas","Permite usarlo por vía oral"], c:1, e:"La vasoconstricción mantiene el anestésico en la zona más tiempo y reduce la toxicidad sistémica."},
{q:"¿Cuál de estos anestésicos es un éster?", o:["Lidocaína","Bupivacaína","Benzocaína","Mepivacaína"], c:2, e:"Benzocaína (un solo «i»): éster. Lidocaína, bupivacaína y mepivacaína son amidas."}]};

TEMAS[12] = {t:"Relajantes musculares",
idea:"Hay que distinguir tres situaciones: la espasticidad por lesión neurológica, la contractura muscular dolorosa y la parálisis buscada durante una anestesia. Cada una tiene sus fármacos.",
claves:[
"**Espasticidad ≠ contractura**: la espasticidad viene de una lesión de la neurona motora superior (ictus, lesión medular, esclerosis múltiple, parálisis cerebral); la contractura, de un músculo sobrecargado.",
"**Espasmolíticos centrales**: baclofeno (GABA-B), tizanidina (α2) y benzodiacepinas. **Periféricos**: dantroleno y toxina botulínica.",
"**Antiespasmódicos** (metocarbamol, ciclobenzaprina, tiocolchicósido): contracturas y lumbalgias, durante pocos días.",
"Los **bloqueantes neuromusculares** paralizan, pero **no sedan ni alivian el dolor**: siempre con hipnótico, analgesia y ventilación.",
"La **hipertermia maligna** (anestésicos inhalatorios y succinilcolina) se trata con **dantroleno**."],
grupos:[
{n:"Espasmolíticos de acción central", mec:"Reducen la excitabilidad de las neuronas motoras en la médula.", ej:["Baclofeno","Tizanidina","Diazepam"], clave:"Baclofeno: oral o intratecal en espasticidad grave. Somnolencia y debilidad.", alerta:"El baclofeno no se suspende de golpe (sobre todo la bomba intratecal): abstinencia grave con alucinaciones, convulsiones e hipertermia."},
{n:"Espasmolíticos de acción periférica", mec:"Dantroleno: bloquea la salida de calcio del retículo sarcoplásmico. Toxina botulínica: impide la liberación de acetilcolina.", ej:["Dantroleno","Toxina botulínica"], clave:"Dantroleno: hipertermia maligna y espasticidad. Toxina botulínica: espasticidad focal, distonías, blefaroespasmo; efecto en días y dura meses."},
{n:"Antiespasmódicos", mec:"Relajantes de acción central para el espasmo muscular agudo.", ej:["Metocarbamol","Ciclobenzaprina","Tiocolchicósido"], clave:"Contracturas y lumbalgia aguda, unos pocos días. Somnolencia.", alerta:"Tiocolchicósido: no en el embarazo ni en la lactancia, y tratamientos muy cortos por su riesgo genotóxico."},
{n:"Bloqueantes neuromusculares", mec:"Antagonistas nicotínicos de la placa motora. **Despolarizantes** (succinilcolina) y **no despolarizantes** (rocuronio).", ej:["Succinilcolina","Rocuronio","Vecuronio","Cisatracurio"], clave:"Intubación y cirugía. La succinilcolina produce fasciculaciones e hiperpotasemia. Reversión: **neostigmina** (con atropina) o **sugammadex** (rocuronio, vecuronio).", alerta:"Un paciente paralizado puede estar consciente: nunca un bloqueante sin sedación y sin control de la vía aérea."}],
alertas:["Somnolencia con casi todos los relajantes: advierte sobre conducir y sobre el alcohol.","Antecedente familiar de problemas con la anestesia: puede ser una susceptibilidad a la hipertermia maligna. Debe constar en la historia."],
enlaces:"Tema 5 (neostigmina) y Tema 15 (benzodiacepinas).",
quiz:[
{q:"¿Qué fármaco se usa en la hipertermia maligna?", o:["Baclofeno","Dantroleno","Succinilcolina","Neostigmina"], c:1, e:"El dantroleno frena la salida masiva de calcio del retículo sarcoplásmico, causa de la crisis."},
{q:"Un paciente con lesión medular tiene espasticidad grave en las piernas. ¿Qué grupo es el adecuado?", o:["Antiespasmódicos como el metocarbamol","Espasmolíticos como el baclofeno","Bloqueantes neuromusculares","Anestésicos locales"], c:1, e:"La espasticidad por lesión de neurona motora superior se trata con espasmolíticos (baclofeno, tizanidina, toxina botulínica)."},
{q:"¿Qué afirmación sobre los bloqueantes neuromusculares es correcta?", o:["Producen sedación profunda","Alivian el dolor postoperatorio","Paralizan sin sedar: el paciente necesita hipnótico y ventilación","Se revierten con naloxona"], c:2, e:"Bloquean la placa motora, incluido el diafragma; no actúan sobre la conciencia ni el dolor."},
{q:"¿Por qué no debe retirarse bruscamente el baclofeno?", o:["Por riesgo de hipoglucemia","Por un síndrome de abstinencia con convulsiones, alucinaciones e hipertermia","Porque produce hiperpotasemia","Porque causa hipotensión de primera dosis"], c:1, e:"La retirada brusca, sobre todo del baclofeno intratecal, puede ser grave e incluso mortal."}]};

TEMAS[13] = {t:"Parkinson y fármacos antiparkinsonianos", fig:"balanza",
idea:"En el Parkinson mueren las neuronas dopaminérgicas de la sustancia negra. El paciente no tiene un problema de fuerza: tiene el freno del movimiento pisado.",
claves:[
"**Balanza volcada**: falta dopamina en el estriado y, en relativo, sobra acetilcolina. Se trata subiendo la dopamina o bajando la acetilcolina.",
"La **levodopa** es el fármaco más eficaz. Se combina con **carbidopa o benserazida** para que no se transforme en dopamina fuera del cerebro.",
"La levodopa se da **a su hora y lejos de las proteínas**: compiten por la absorción. Un retraso es un «off», una caída o una broncoaspiración.",
"Con los años aparecen **fluctuaciones** (fin de dosis, on-off) y **discinesias**.",
"Los **agonistas dopaminérgicos** pueden producir **ludopatía y compras compulsivas** y somnolencia súbita: hay que preguntarlo.",
"Ante un mayor que «se ha vuelto lento», revisa la medicación: antipsicóticos, metoclopramida y valproato producen parkinsonismo."],
grupos:[
{n:"Levodopa e inhibidores de su degradación", mec:"Precursor de la dopamina que atraviesa la barrera. Carbidopa y benserazida bloquean la dopa-descarboxilasa periférica; la entacapona bloquea la COMT.", ej:["Levodopa + carbidopa","Levodopa + benserazida","Entacapona","Opicapona"], clave:"Náuseas, hipotensión ortostática, discinesias, alucinaciones. La entacapona tiñe la orina de naranja.", alerta:"No retirarla bruscamente: puede producir un cuadro parecido al síndrome neuroléptico maligno."},
{n:"Inhibidores de la MAO-B", mec:"Frenan la degradación de la dopamina en el cerebro.", ej:["Selegilina","Rasagilina","Safinamida"], clave:"Fases iniciales o como complemento de la levodopa. Precaución con ISRS, tramadol y simpaticomiméticos."},
{n:"Agonistas dopaminérgicos", mec:"Estimulan directamente los receptores de dopamina.", ej:["Pramipexol","Ropinirol","Rotigotina","Apomorfina"], clave:"Rotigotina en parche. Apomorfina subcutánea como rescate de los bloqueos. Pramipexol y ropinirol también tratan el síndrome de piernas inquietas.", alerta:"Somnolencia súbita (precaución al conducir) y trastornos del control de impulsos: ludopatía, compras, hipersexualidad."},
{n:"Amantadina", mec:"Antagonista NMDA que aumenta la liberación de dopamina.", ej:["Amantadina"], clave:"Útil para reducir las discinesias de la levodopa. Livedo reticularis, edemas, confusión."},
{n:"Anticolinérgicos centrales", mec:"Bloquean el exceso relativo de acetilcolina en el estriado.", ej:["Trihexifenidilo","Biperideno"], clave:"Temblor en pacientes jóvenes; el biperideno es también el tratamiento de la distonía aguda por fármacos.", alerta:"Evitarlos en ancianos: confusión, retención urinaria, estreñimiento."}],
alertas:["Respeta el horario exacto de la levodopa en el hospital; no la retrases por pruebas o ayunos sin consultarlo.","Para las náuseas de un paciente con Parkinson, domperidona; nunca metoclopramida ni haloperidol, que empeoran el cuadro."],
enlaces:"Tema 17 (antipsicóticos): Parkinson y psicosis son los dos extremos del mismo eje dopaminérgico.",
quiz:[
{q:"¿Por qué se combina la levodopa con carbidopa?", o:["Para que atraviese mejor la barrera hematoencefálica","Para evitar que se transforme en dopamina fuera del cerebro","Para prolongar su efecto en el estriado","Para reducir las discinesias"], c:1, e:"La carbidopa inhibe la dopa-descarboxilasa periférica: llega más levodopa al cerebro y hay menos efectos periféricos."},
{q:"¿Qué consejo sobre la levodopa es correcto?", o:["Tomarla con un batido de proteínas","Tomarla a su hora, separada de las comidas ricas en proteínas","Saltarse dosis si hay discinesias, sin consultar","Tomarla solo cuando haya temblor"], c:1, e:"Las proteínas compiten con la levodopa por la absorción; los horarios estables evitan los periodos off."},
{q:"La familia de un paciente con pramipexol cuenta que juega a las apuestas cada noche. ¿Qué sospechas?", o:["Demencia por la enfermedad","Trastorno del control de impulsos por el agonista dopaminérgico","Efecto de la carbidopa","Una crisis on-off"], c:1, e:"Es una RAM conocida de los agonistas dopaminérgicos que el paciente rara vez relaciona con la pastilla."},
{q:"¿Qué antiemético usarías en un paciente con Parkinson?", o:["Metoclopramida","Haloperidol","Domperidona","Clorpromazina"], c:2, e:"La domperidona apenas atraviesa la barrera hematoencefálica y no empeora el parkinsonismo."}]};

TEMAS[14] = {t:"Depresión y fármacos antidepresivos",
idea:"Los antidepresivos aumentan la serotonina o la noradrenalina en la sinapsis en horas, pero los síntomas mejoran en semanas. Esa latencia explica muchos abandonos.",
claves:[
"Hipótesis **monoaminérgica** (déficit de serotonina y noradrenalina) y **neurotrófica** (la mejoría tarda porque requiere cambios en la plasticidad neuronal).",
"Los **ISRS** son la primera línea: eficaces, seguros en sobredosis y con pocos efectos anticolinérgicos.",
"Efecto en **2-4 semanas**. Las primeras semanas son las de mayor riesgo de ideas suicidas en jóvenes: vigilancia estrecha.",
"**No suspender de golpe**: síndrome de discontinuación (mareo, irritabilidad, sensaciones de «calambre»), sobre todo con paroxetina y venlafaxina.",
"**Síndrome serotoninérgico** al combinar serotoninérgicos (ISRS, IMAO, tramadol, triptanes, linezolid): agitación, temblor, mioclonías, hipertermia."],
grupos:[
{n:"Inhibidores selectivos de la recaptación de serotonina (ISRS)", mec:"Bloquean el transportador de serotonina (SERT).", ej:["Sertralina","Fluoxetina","Citalopram","Escitalopram","Paroxetina","Fluvoxamina"], clave:"Depresión, ansiedad, TOC. RAM: náuseas, insomnio o somnolencia, disfunción sexual, hiponatremia en ancianos, **sangrado** (más con AINE o anticoagulantes). Citalopram y escitalopram prolongan el QT."},
{n:"Inhibidores mixtos de la recaptación (IRSN)", mec:"Bloquean la recaptación de serotonina y noradrenalina sin afectar a otros receptores.", ej:["Venlafaxina","Duloxetina","Desvenlafaxina"], clave:"Depresión; la duloxetina también en el dolor neuropático. Pueden subir la tensión arterial."},
{n:"Antidepresivos tricíclicos", mec:"Inhiben la recaptación de serotonina y noradrenalina y bloquean receptores muscarínicos, H1 y α1.", ej:["Amitriptilina","Imipramina","Clomipramina","Nortriptilina"], clave:"Hoy más usados en dolor neuropático y profilaxis de migraña. RAM anticolinérgicas, sedación, hipotensión ortostática, aumento de peso.", alerta:"Muy tóxicos en sobredosis (arritmias por bloqueo de canales de sodio): cuidado en pacientes con riesgo suicida."},
{n:"Inhibidores de la recaptación de noradrenalina (y dopamina)", mec:"Bloquean la recaptación de noradrenalina (y de dopamina, el bupropión).", ej:["Reboxetina","Bupropión","Atomoxetina"], clave:"Bupropión: depresión y deshabituación tabáquica; baja el umbral convulsivo. Atomoxetina: TDAH."},
{n:"Inhibidores de la MAO (IMAO)", mec:"Inhiben la enzima que degrada las monoaminas.", ej:["Moclobemida","Tranilcipromina"], clave:"Reservados para depresiones resistentes. La moclobemida es reversible y selectiva de la MAO-A; la tranilcipromina, irreversible y no selectiva.", alerta:"Crisis hipertensiva con alimentos ricos en tiramina (quesos curados) o simpaticomiméticos; síndrome serotoninérgico con ISRS o tramadol."},
{n:"Antagonistas de receptores", mec:"Bloquean receptores presinápticos α2 y 5-HT2, lo que aumenta la liberación de monoaminas.", ej:["Mirtazapina","Trazodona","Mianserina"], clave:"Sedantes: útiles con insomnio. La mirtazapina aumenta el apetito y el peso."}],
alertas:["Explica al paciente que el antidepresivo tarda semanas en hacer efecto y que los efectos adversos aparecen antes: así se evita el abandono precoz.","Vigila especialmente las primeras semanas y los cambios de dosis en adolescentes y adultos jóvenes.","Un paciente con ISRS y un AINE pautado tiene más riesgo de hemorragia digestiva."],
quiz:[
{q:"¿Cuánto tarda en aparecer el efecto antidepresivo?", o:["Unas horas","1-2 días","2-4 semanas","3-6 meses"], c:2, e:"La química sináptica cambia en horas, pero la mejoría clínica requiere semanas de adaptación neuronal."},
{q:"¿Qué grupo de antidepresivos es especialmente peligroso en sobredosis por su cardiotoxicidad?", o:["ISRS","Tricíclicos","Mirtazapina","Bupropión a dosis bajas"], c:1, e:"Los tricíclicos bloquean canales de sodio cardiacos: arritmias graves en sobredosis."},
{q:"¿Cuál es el riesgo de combinar un IMAO con tramadol?", o:["Hipoglucemia","Síndrome serotoninérgico","Bradicardia","Hiperpotasemia"], c:1, e:"Ambos aumentan la serotonina: agitación, temblor, mioclonías e hipertermia."},
{q:"Un paciente con paroxetina deja de tomarla de golpe y nota mareo, irritabilidad y sensación de calambres. Se trata de:", o:["Una recaída de la depresión","Un síndrome de discontinuación","Una reacción alérgica","Un síndrome neuroléptico maligno"], c:1, e:"Por eso los antidepresivos se retiran de forma gradual, sobre todo los de semivida corta."}]};

TEMAS[15] = {t:"Fármacos ansiolíticos e hipnóticos",
idea:"Las benzodiacepinas potencian al GABA, el gran freno del cerebro. No abren el canal por sí solas: solo amplifican el efecto del GABA. De ahí su techo y su relativa seguridad.",
claves:[
"Las **benzodiacepinas** son **moduladores alostéricos positivos** del receptor GABA-A: aumentan el efecto del GABA endógeno.",
"Los **barbitúricos** pueden abrir el canal con más intensidad y duración, sin techo: mucho más peligrosos.",
"Efectos: ansiolítico, hipnótico, anticonvulsivante, relajante muscular y amnésico.",
"Con **alcohol u opioides** se pierde el techo: depresión respiratoria. Antídoto: **flumazenilo**, de acción más corta que muchas benzodiacepinas.",
"En el anciano, benzodiacepinas de **fase II** (lorazepam, oxazepam, lormetazepam), dosis bajas y siempre con un plan de retirada.",
"Tolerancia y dependencia: tratamientos cortos (insomnio, 2-4 semanas) y **retirada gradual**."],
grupos:[
{n:"Benzodiacepinas de acción corta y ultracorta", mec:"Moduladores positivos del GABA-A con semivida corta.", ej:["Midazolam","Triazolam","Lormetazepam"], clave:"Sedación para procedimientos (midazolam) e insomnio de conciliación, con menos resaca."},
{n:"Benzodiacepinas de acción intermedia", mec:"Moduladores positivos del GABA-A.", ej:["Lorazepam","Alprazolam","Oxazepam","Bromazepam"], clave:"Ansiedad. Lorazepam y oxazepam se metabolizan solo por glucuronidación (fase II): preferibles en ancianos y hepatópatas."},
{n:"Benzodiacepinas de acción larga", mec:"Moduladores positivos del GABA-A con metabolitos activos.", ej:["Diazepam","Clorazepato","Clonazepam"], clave:"Ansiedad, abstinencia alcohólica, crisis epilépticas (diazepam rectal, clonazepam). Se acumulan en ancianos.", alerta:"Somnolencia diurna, caídas y fracturas en personas mayores."},
{n:"Hipnóticos Z", mec:"Actúan sobre el receptor GABA-A (subunidad α1).", ej:["Zolpidem","Zopiclona"], clave:"Insomnio de conciliación, tratamientos cortos. Pueden producir conductas complejas durante el sueño."},
{n:"Barbitúricos", mec:"Aumentan la apertura del canal de cloruro; a dosis altas lo abren directamente.", ej:["Fenobarbital","Tiopental"], clave:"Hoy solo como antiepiléptico (fenobarbital) e inductor anestésico (tiopental). Margen estrecho e inductores enzimáticos."},
{n:"Otros ansiolíticos e hipnóticos", mec:"Mecanismos distintos del GABA-A.", ej:["Buspirona","Hidroxizina","Melatonina"], clave:"Buspirona: no seda ni crea dependencia, pero tarda semanas. Melatonina: alteraciones del ritmo del sueño y jet lag."}],
alertas:["Antes de una benzodiacepina, valora la higiene del sueño y la causa de la ansiedad o el insomnio.","No combines benzodiacepinas con alcohol u opioides sin vigilancia: riesgo de depresión respiratoria.","Si se usa flumazenilo, vigila la resedación (dura menos) y el riesgo de convulsiones en pacientes dependientes."],
quiz:[
{q:"¿Qué diferencia el mecanismo de las benzodiacepinas del de los barbitúricos?", o:["Las benzodiacepinas abren el canal de cloruro por sí solas","Las benzodiacepinas solo potencian al GABA y tienen techo; los barbitúricos pueden abrir el canal con más intensidad","Las benzodiacepinas actúan sobre el receptor GABA-B","Los barbitúricos bloquean los receptores NMDA"], c:1, e:"La benzodiacepina modula; el barbitúrico puede actuar sin GABA y no tiene techo: por eso es más peligroso."},
{q:"¿Qué benzodiacepina es preferible en un anciano?", o:["Diazepam","Clorazepato","Lorazepam","Flurazepam"], c:2, e:"El lorazepam se elimina por glucuronidación (fase II), sin metabolitos activos, y no se acumula tanto."},
{q:"¿Cuál es el antídoto de una intoxicación por benzodiacepinas?", o:["Naloxona","Flumazenilo","N-acetilcisteína","Atropina"], c:1, e:"El flumazenilo es un antagonista competitivo del sitio benzodiacepínico; su efecto dura poco."},
{q:"¿Qué combinación aumenta más el riesgo de depresión respiratoria?", o:["Lorazepam y paracetamol","Diazepam y alcohol","Melatonina e ibuprofeno","Buspirona y omeprazol"], c:1, e:"El alcohol y los opioides suman su efecto depresor y eliminan el techo de seguridad de las benzodiacepinas."}]};

TEMAS[16] = {t:"Fármacos antiepilépticos",
idea:"La epilepsia es una balanza volcada hacia la excitación. Los antiepilépticos ponen freno (GABA) o quitan acelerador (sodio, calcio, glutamato).",
claves:[
"Crisis **focales** (por una lesión localizada) y **generalizadas** (tónico-clónicas, ausencias).",
"Los bloqueantes del canal de sodio son **«badenes inteligentes»**: actúan sobre todo en las neuronas que disparan demasiado (bloqueo dependiente del uso).",
"Ante una crisis: **mirar el reloj**, proteger la cabeza, nada en la boca y posición lateral al terminar. **Más de 5 minutos es un estado epiléptico**: benzodiacepina.",
"El **valproato** es uno de los teratógenos más potentes: no en mujeres en edad fértil salvo programa de prevención del embarazo.",
"Muchos antiepilépticos son **inductores enzimáticos** (carbamazepina, fenitoína, fenobarbital): fallo de los anticonceptivos y de otros fármacos.",
"Nunca se suspenden de golpe: riesgo de crisis y de estado epiléptico."],
grupos:[
{n:"Bloqueantes de los canales de sodio", mec:"Estabilizan el canal de sodio inactivado y frenan las descargas repetidas.", ej:["Carbamazepina","Oxcarbazepina","Fenitoína","Lamotrigina","Lacosamida"], clave:"Base de las crisis focales. RAM: mareo, diplopía, ataxia. Carbamazepina: inductora, hiponatremia, exantemas graves. Fenitoína: hiperplasia gingival y margen estrecho. Lamotrigina: exantema, subir la dosis despacio.", alerta:"Carbamazepina y fenitoína reducen la eficacia de los anticonceptivos hormonales."},
{n:"Potenciadores del GABA", mec:"Aumentan la inhibición GABAérgica: sobre el receptor GABA-A (benzodiacepinas, barbitúricos) o aumentando el GABA disponible (vigabatrina, tiagabina).", ej:["Clonazepam","Diazepam","Midazolam","Lorazepam","Fenobarbital","Vigabatrina"], clave:"Benzodiacepinas: tratamiento de la crisis prolongada (midazolam bucal o intranasal, diazepam rectal, lorazepam IV). Su uso crónico se limita por sedación y tolerancia."},
{n:"Bloqueantes de los canales de calcio", mec:"Reducen la entrada de calcio en la terminal presináptica o en el tálamo.", ej:["Etosuximida","Gabapentina","Pregabalina"], clave:"Etosuximida: ausencias. Gabapentina y pregabalina: crisis focales y, sobre todo, **dolor neuropático**. La pregabalina tiene potencial de abuso."},
{n:"Otros mecanismos y amplio espectro", mec:"Reducen la liberación de glutamato o actúan por varios mecanismos.", ej:["Levetiracetam","Valproato","Topiramato","Perampanel"], clave:"Levetiracetam: muy usado, pocas interacciones, irritabilidad. Valproato: amplio espectro, hepatotoxicidad, pancreatitis, aumento de peso. Topiramato: pérdida de peso, cálculos renales.", alerta:"Valproato: malformaciones (espina bífida) y alteraciones del neurodesarrollo. Prohibido en el embarazo salvo excepciones."}],
alertas:["Ante una crisis, cronometra: si dura más de 5 minutos, administra la benzodiacepina pautada y avisa.","Revisa siempre las interacciones de un antiepiléptico nuevo, especialmente con anticonceptivos y anticoagulantes."],
quiz:[
{q:"¿A partir de cuánto tiempo una crisis convulsiva se considera estado epiléptico y requiere tratamiento?", o:["30 segundos","5 minutos","30 minutos","1 hora"], c:1, e:"Más de 5 minutos de crisis (o crisis repetidas sin recuperar) es un estado epiléptico: benzodiacepina."},
{q:"¿Qué antiepiléptico está contraindicado en mujeres en edad fértil salvo programa de prevención del embarazo?", o:["Levetiracetam","Lamotrigina","Valproato","Gabapentina"], c:2, e:"El valproato produce malformaciones y alteraciones del neurodesarrollo."},
{q:"Una paciente con carbamazepina y anticonceptivos orales queda embarazada. ¿Qué mecanismo lo explica?", o:["La carbamazepina inhibe el CYP3A4","La carbamazepina induce el metabolismo del anticonceptivo","La carbamazepina desplaza al anticonceptivo de la albúmina","Es una RAM de tipo B"], c:1, e:"Es un inductor enzimático: acelera el metabolismo de las hormonas y reduce su eficacia (RAM tipo F)."},
{q:"¿Qué antiepilépticos se usan también en el dolor neuropático?", o:["Etosuximida y fenobarbital","Gabapentina y pregabalina","Fenitoína y valproato","Vigabatrina y tiagabina"], c:1, e:"Reducen la liberación de neurotransmisores excitadores en las vías del dolor."}]};

TEMAS[17] = {t:"Fármacos antipsicóticos",
idea:"La eficacia de un antipsicótico es el bloqueo de los receptores D2. Bloquear la dopamina en las vías equivocadas produce sus efectos adversos.",
claves:[
"**Hipótesis dopaminérgica**: exceso de dopamina en la vía mesolímbica (síntomas positivos: delirios, alucinaciones).",
"**Típicos** (haloperidol, clorpromazina): más efectos **extrapiramidales**. **Atípicos** (risperidona, olanzapina, quetiapina, aripiprazol, clozapina): menos, pero **síndrome metabólico**.",
"La **acatisia** se confunde con agitación: si se sube la dosis, empeora.",
"**Síndrome neuroléptico maligno**: fiebre, rigidez, alteración de la conciencia, inestabilidad autonómica y CPK alta. Es una urgencia.",
"**Fiebre o dolor de garganta con clozapina = hemograma urgente** (agranulocitosis).",
"En ancianos con demencia aumentan la mortalidad y el riesgo de ictus."],
grupos:[
{n:"Antipsicóticos típicos", mec:"Antagonistas potentes de los receptores D2.", ej:["Haloperidol","Clorpromazina","Levomepromazina","Zuclopentixol"], clave:"Haloperidol: agitación y delirio. Mucho efecto extrapiramidal y aumento de prolactina.", alerta:"Distonía aguda (tortícolis, crisis oculógiras) en jóvenes: se trata con biperideno."},
{n:"Antipsicóticos atípicos", mec:"Bloquean D2 y receptores de serotonina 5-HT2A; el aripiprazol es agonista parcial D2.", ej:["Risperidona","Paliperidona","Olanzapina","Quetiapina","Aripiprazol","Ziprasidona"], clave:"Primera línea en la esquizofrenia. Olanzapina: mucho aumento de peso. Risperidona: prolactina. Quetiapina: sedación e hipotensión. Existen formas depot inyectables para mejorar la adherencia.", alerta:"Controla peso, glucemia, lípidos y tensión arterial: síndrome metabólico."},
{n:"Clozapina", mec:"Antipsicótico atípico con poco bloqueo D2 y muchas otras dianas.", ej:["Clozapina"], clave:"Esquizofrenia resistente. Casi sin efectos extrapiramidales, pero agranulocitosis, convulsiones, sialorrea y estreñimiento grave.", alerta:"Hemogramas periódicos obligatorios. Fiebre o dolor de garganta: avisar de inmediato."}],
alertas:["Inquietud, imposibilidad de estar quieto y ansiedad tras iniciar un antipsicótico: piensa en acatisia antes que en agitación.","Fiebre alta con rigidez y confusión en un paciente con antipsicóticos: síndrome neuroléptico maligno. Suspender el fármaco, enfriar y avisar.","Algunos antipsicóticos prolongan el QT: precaución con otros fármacos que lo alarguen."],
enlaces:"Tema 13 (Parkinson): el mismo eje dopaminérgico; un antipsicótico empuja hacia el parkinsonismo.",
quiz:[
{q:"¿Qué mecanismo es responsable de la eficacia antipsicótica?", o:["Agonismo GABA-A","Bloqueo de receptores D2","Inhibición de la recaptación de serotonina","Bloqueo de canales de sodio"], c:1, e:"La potencia antipsicótica se correlaciona con el bloqueo D2 en la vía mesolímbica."},
{q:"Un paciente con clozapina presenta fiebre y dolor de garganta. ¿Qué hay que hacer?", o:["Pautar paracetamol y esperar","Hemograma urgente por posible agranulocitosis","Aumentar la dosis de clozapina","Añadir biperideno"], c:1, e:"La agranulocitosis es la RAM más grave de la clozapina: la fiebre es una señal de alarma."},
{q:"¿Qué RAM se asocia especialmente a la olanzapina?", o:["Hipoglucemia","Aumento de peso y síndrome metabólico","Agranulocitosis","Hiperplasia gingival"], c:1, e:"Los atípicos, sobre todo olanzapina y clozapina, producen aumento de peso, diabetes y dislipemia."},
{q:"Fiebre de 40 °C, rigidez intensa, confusión y CPK elevada en un paciente con haloperidol sugieren:", o:["Distonía aguda","Acatisia","Síndrome neuroléptico maligno","Discinesia tardía"], c:2, e:"Es una urgencia: suspender el antipsicótico, medidas de soporte y enfriamiento."}]};

TEMAS[18] = {t:"Anestésicos generales",
idea:"La anestesia general es una depresión reversible del sistema nervioso central. La anestesia moderna es balanceada: combina fármacos con funciones distintas.",
claves:[
"Componentes: **hipnosis** (inconsciencia), **analgesia**, **relajación muscular** y control de los reflejos autónomos. Ningún fármaco hace todo.",
"**Anestesia balanceada**: hipnótico + opioide + bloqueante neuromuscular, que no son intercambiables.",
"Inhalatorios: el coeficiente **sangre/gas** indica la rapidez (cuanto menor, más rápido) y el **aceite/gas**, la potencia. La **CAM** es la DE₅₀ de los inhalatorios.",
"El **propofol** es el inductor intravenoso más usado: rápido, con hipotensión y dolor al inyectar.",
"La **ketamina** mantiene la tensión y la respiración y es analgésica, pero produce alucinaciones al despertar."],
grupos:[
{n:"Anestésicos inhalatorios", mec:"Gases o vapores que deprimen el SNC; su efecto depende de la concentración alveolar.", ej:["Sevoflurano","Desflurano","Isoflurano","Óxido nitroso"], clave:"Sevoflurano: inducción inhalatoria en niños. Desflurano: despertar muy rápido. Óxido nitroso: analgésico, poco potente.", alerta:"Los halogenados (y la succinilcolina) pueden desencadenar una **hipertermia maligna**: dantroleno."},
{n:"Anestésicos intravenosos", mec:"Potencian el GABA-A (propofol, tiopental, etomidato, midazolam) o bloquean el NMDA (ketamina).", ej:["Propofol","Ketamina","Etomidato","Tiopental","Midazolam"], clave:"Propofol: inducción y sedación, hipotensión. Ketamina: analgesia y broncodilatación, alucinaciones. Etomidato: estabilidad cardiovascular, frena la suprarrenal. Tiopental: barbitúrico, hoy poco usado."},
{n:"Coadyuvantes de la anestesia", mec:"Completan la anestesia balanceada.", ej:["Fentanilo","Remifentanilo","Rocuronio","Sugammadex","Ondansetrón","Dexametasona"], clave:"Opioides para la analgesia, bloqueantes neuromusculares para la relajación y antieméticos para las náuseas y vómitos postoperatorios."}],
alertas:["En el despertar, vigila la vía aérea, la saturación, el nivel de conciencia, el dolor y las náuseas.","Tras una sedación o anestesia general, el paciente no debe conducir ni tomar decisiones importantes durante 24 horas."],
quiz:[
{q:"¿Qué indica el coeficiente de partición sangre/gas de un anestésico inhalatorio?", o:["Su potencia","Su rapidez de inducción y recuperación","Su toxicidad hepática","Su capacidad analgésica"], c:1, e:"Cuanto menos soluble en sangre, antes se equilibra y más rápida es la inducción y la recuperación. La potencia la indica el aceite/gas."},
{q:"¿Qué es la CAM?", o:["La concentración tóxica de un anestésico local","La concentración alveolar que impide el movimiento ante el estímulo quirúrgico en el 50 % de los pacientes","La dosis máxima de propofol","Un tipo de anestesia regional"], c:1, e:"Es la medida de potencia de los inhalatorios: equivale a su DE₅₀."},
