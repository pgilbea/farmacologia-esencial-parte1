<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmacología clínica · Primer parcial · Enfermería UPNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F9; --surface:#FFFFFF; --ink:#16212C; --muted:#56616E; --line:#D8DEE5; --soft:#EEF1F4;
  --ok:#2E7D4F; --ok-bg:#E6F3EB; --bad:#B23A2E; --bad-bg:#FBE9E6; --warn:#9A5B00; --warn-bg:#FDF2DD;
  --b1:#1E6C86; --b2:#6B7C12; --b3:#7B3F6E; --b4:#2F5C9A; --b5:#A07400; --b6:#B24E16;
  --acc:var(--b1);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171D; --surface:#19212A; --ink:#E7ECF1; --muted:#A3AEBA; --line:#2C3743; --soft:#212B35;
    --ok:#6CC596; --ok-bg:#1B3428; --bad:#F08A7E; --bad-bg:#3A1F1C; --warn:#E9B45A; --warn-bg:#382B14;
    --b1:#4FA7C4; --b2:#A6B83E; --b3:#C07BB2; --b4:#7BA3DD; --b5:#D9AE3B; --b6:#E7864F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11171D; --surface:#19212A; --ink:#E7ECF1; --muted:#A3AEBA; --line:#2C3743; --soft:#212B35;
  --ok:#6CC596; --ok-bg:#1B3428; --bad:#F08A7E; --bad-bg:#3A1F1C; --warn:#E9B45A; --warn-bg:#382B14;
  --b1:#4FA7C4; --b2:#A6B83E; --b3:#C07BB2; --b4:#7BA3DD; --b5:#D9AE3B; --b6:#E7864F;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6; }
a{ color:inherit; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--acc); outline-offset:2px; border-radius:4px; }
.skip{ position:absolute; left:-999px; top:0; }
.skip:focus{ left:12px; top:12px; z-index:50; background:var(--surface); padding:8px 12px; }

/* ---------- estructura ---------- */
.shell{ display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100vh; }
.shell > *{ min-width:0; }
aside.index{ position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--surface); border-right:1px solid var(--line); padding:22px 0 40px; }
.brand{ padding:0 22px 18px; border-bottom:1px solid var(--line); margin-bottom:10px; }
.brand a{ text-decoration:none; display:block; }
.brand strong{ font-family:var(--display); font-size:1.32rem; font-weight:800; line-height:1.1; letter-spacing:-.01em; display:block; }
.brand span{ color:var(--muted); font-size:.88rem; }
.search{ margin:12px 22px 6px; position:relative; }
.search input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:inherit; font-size:.95rem; }
.navlinks{ padding:6px 14px 4px; display:flex; gap:6px; flex-wrap:wrap; }
.navlinks a{ text-decoration:none; font-size:.92rem; padding:6px 10px; border-radius:7px; border:1px solid var(--line); }
.navlinks a[aria-current="page"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

/* pestañas de bloque: el elemento distintivo, como separadores de un vademécum */
.tab{ margin:10px 0 0; }
.tab > button{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; cursor:pointer; padding:10px 18px 10px 0; }
.tab .chip{ flex:none; width:44px; height:38px; border-radius:0 10px 10px 0; background:var(--c); color:var(--surface); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.05rem; }
.tab .tt{ font-weight:700; line-height:1.25; font-size:.98rem; }
.tab .tt small{ display:block; font-weight:400; color:var(--muted); font-size:.82rem; }
.tab ol{ list-style:none; margin:2px 0 6px; padding:0 14px 0 56px; display:none; }
.tab.open ol{ display:block; }
.tab ol a{ display:flex; gap:8px; align-items:baseline; text-decoration:none; padding:5px 8px; border-radius:6px; font-size:.93rem; color:var(--ink); }
.tab ol a:hover{ background:var(--soft); }
.tab ol a[aria-current="page"]{ background:color-mix(in srgb, var(--c) 16%, transparent); font-weight:700; }
.tab ol a .n{ color:var(--c); font-weight:700; min-width:1.6em; }
.tab ol a .done{ margin-left:auto; color:var(--ok); font-size:.8rem; }

main{ padding:28px clamp(18px,4vw,56px) 80px; max-width:1060px; width:100%; }
.topbar{ display:none; }

/* ---------- portada ---------- */
.hero{ padding:26px 0 8px; }
.hero h1{ font-family:var(--display); font-weight:800; font-size:clamp(2.1rem,5vw,3.4rem); line-height:1.02; letter-spacing:-.02em; margin:0 0 14px; max-width:16ch; }
.hero p{ font-size:1.1rem; color:var(--muted); max-width:62ch; margin:0 0 8px; }
.binder{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; margin:30px 0; }
.binder a{ text-decoration:none; display:block; background:var(--surface); border:1px solid var(--line); border-left:10px solid var(--c); border-radius:4px 12px 12px 4px; padding:16px 18px 18px; }
.binder a:hover{ border-color:var(--c); }
.binder h2{ font-family:var(--display); margin:0 0 2px; font-size:1.25rem; line-height:1.2; padding-right:56px; }
.binder .roman{ color:var(--c); font-family:var(--display); font-weight:800; font-size:2.2rem; line-height:1; float:right; }
.binder p{ margin:6px 0 0; color:var(--muted); font-size:.94rem; }
.binder .bar{ height:6px; background:var(--soft); border-radius:3px; margin-top:12px; overflow:hidden; }
.binder .bar i{ display:block; height:100%; background:var(--c); }
.how{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; margin-top:12px; }
.how div{ border-top:3px solid var(--ink); padding-top:10px; }
.how h3{ font-family:var(--display); margin:0 0 4px; font-size:1.08rem; }
.how p{ margin:0; color:var(--muted); font-size:.95rem; }

/* ---------- página de tema ---------- */
.thead{ display:grid; grid-template-columns:auto 1fr; gap:6px 24px; align-items:end; padding:10px 0 22px; border-bottom:2px solid var(--c); margin-bottom:26px; }
.thead .big{ font-family:var(--display); font-weight:800; font-size:clamp(4rem,11vw,7.5rem); line-height:.82; color:var(--c); letter-spacing:-.04em; grid-row:span 2; }
.thead .blk{ color:var(--muted); font-size:.95rem; }
.thead h1{ font-family:var(--display); font-weight:800; font-size:clamp(1.7rem,3.6vw,2.6rem); line-height:1.08; margin:0; letter-spacing:-.015em; }
.lede{ font-size:1.15rem; max-width:64ch; margin:0 0 26px; }
h2.sec{ font-family:var(--display); font-size:1.45rem; margin:38px 0 14px; letter-spacing:-.01em; }
ul.keys{ list-style:none; padding:0; margin:0; display:grid; gap:10px; max-width:76ch; }
ul.keys li{ position:relative; padding:12px 16px 12px 46px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
ul.keys li::before{ content:""; position:absolute; left:16px; top:20px; width:14px; height:14px; border-radius:50%; background:var(--c); }
.figure{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; margin:18px 0 0; overflow-x:auto; }
.figure svg{ display:block; width:100%; height:auto; min-width:560px; }
.figure figcaption{ color:var(--muted); font-size:.9rem; margin-top:8px; }

/* fichas de grupo: estilo etiqueta de medicamento */
.fichas{ display:grid; gap:12px; }
details.ficha{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
details.ficha summary{ list-style:none; cursor:pointer; display:grid; grid-template-columns:8px 1fr auto; gap:14px; align-items:center; padding:0 16px 0 0; }
details.ficha summary::-webkit-details-marker{ display:none; }
details.ficha summary .strip{ align-self:stretch; background:var(--c); }
details.ficha summary .nm{ padding:14px 0; }
details.ficha summary .nm b{ font-family:var(--display); font-size:1.12rem; display:block; line-height:1.25; }
details.ficha summary .nm span{ color:var(--muted); font-size:.92rem; }
details.ficha summary .pm{ font-size:1.4rem; color:var(--c); transition:transform .2s; }
details.ficha[open] summary .pm{ transform:rotate(45deg); }
.ficha .body{ padding:2px 20px 18px 30px; display:grid; gap:10px; }
.ficha .row{ display:grid; grid-template-columns:130px 1fr; gap:12px; }
.ficha .row > b{ color:var(--muted); font-weight:700; font-size:.92rem; padding-top:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chips span{ background:color-mix(in srgb, var(--c) 13%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius:999px; padding:2px 11px; font-size:.92rem; }
.alerta{ background:var(--warn-bg); border-left:4px solid var(--warn); border-radius:6px; padding:9px 12px; font-size:.96rem; }
.alerts{ display:grid; gap:10px; max-width:80ch; }
.alerts div{ background:var(--warn-bg); border-left:5px solid var(--warn); border-radius:8px; padding:12px 16px; }
.links{ color:var(--muted); font-size:.95rem; }

/* cuestionario */
.quiz{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px 22px 20px; }
.q{ padding:16px 0 14px; border-bottom:1px dashed var(--line); }
.q:last-of-type{ border-bottom:0; }
.q h3{ font-size:1.05rem; margin:0 0 10px; line-height:1.4; }
.q h3 .num{ color:var(--c); font-family:var(--display); margin-right:6px; }
.opts{ display:grid; gap:8px; }
.opts button{ text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 14px; cursor:pointer; display:grid; grid-template-columns:28px 1fr; gap:8px; align-items:start; }
.opts button:hover:not(:disabled){ border-color:var(--c); }
.opts button .l{ font-weight:700; color:var(--c); }
.opts button.ok{ background:var(--ok-bg); border-color:var(--ok); }
.opts button.bad{ background:var(--bad-bg); border-color:var(--bad); }
.opts button:disabled{ cursor:default; }
.expl{ margin-top:10px; padding:10px 14px; border-radius:8px; background:var(--soft); font-size:.96rem; display:none; }
.expl.show{ display:block; }
.expl b.r{ color:var(--ok); } .expl b.w{ color:var(--bad); }
.score{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding-top:12px; }
.score p{ margin:0; font-weight:700; }
.btn{ background:var(--ink); color:var(--surface); border:0; border-radius:9px; padding:10px 16px; cursor:pointer; font-weight:700; text-decoration:none; display:inline-block; }
.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
.pager{ display:flex; justify-content:space-between; gap:12px; margin-top:40px; flex-wrap:wrap; }
.pager a{ text-decoration:none; border:1px solid var(--line); border-radius:10px; padding:12px 16px; background:var(--surface); max-width:48%; }
.pager a small{ display:block; color:var(--muted); }

/* repaso e índice */
.filters{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px; }
.filters label{ display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:5px 12px; background:var(--surface); cursor:pointer; font-size:.95rem; }
.filters input{ accent-color:var(--ink); }
.az{ columns:3 230px; column-gap:28px; }
.az .letter{ font-family:var(--display); font-weight:800; font-size:1.4rem; margin:14px 0 4px; break-after:avoid; }
.az a{ display:block; text-decoration:none; padding:3px 0; break-inside:avoid; }
.az a small{ color:var(--muted); }
.az a i{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:6px; }
.empty{ color:var(--muted); }
.results a{ display:block; text-decoration:none; padding:10px 14px; border:1px solid var(--line); border-left:6px solid var(--c); border-radius:8px; margin-bottom:8px; background:var(--surface); }
.results a small{ color:var(--muted); display:block; }
footer{ color:var(--muted); font-size:.88rem; margin-top:60px; border-top:1px solid var(--line); padding-top:14px; }

/* ---------- móvil ---------- */
@media (max-width: 880px){
  .shell{ grid-template-columns:minmax(0,1fr); }
  aside.index{ position:fixed; inset:0 auto 0 0; width:min(86vw,320px); z-index:30; transform:translateX(-105%); transition:transform .25s; padding-top:calc(env(safe-area-inset-top,0px) + 18px); }
  body.menu aside.index{ transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.35); }
  .topbar{ display:flex; position:sticky; top:0; z-index:20; align-items:center; gap:12px; padding:10px 16px; padding-top:calc(env(safe-area-inset-top,0px) + 10px); margin-top:calc(-1 * env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar button{ background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .topbar strong{ font-family:var(--display); }
  main{ padding-top:18px; }
  .ficha .row{ grid-template-columns:1fr; gap:2px; }
  .thead{ grid-template-columns:1fr; }
  .thead .big{ grid-row:auto; }
  .pager a{ max-width:100%; flex:1 1 100%; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<div class="shell">

    <div class="search"><input type="search" id="q" placeholder="Busca un fármaco o un tema" aria-label="Buscar un fármaco o un tema"></div>

      <a href="#inicio" data-r="inicio">Inicio</a><a href="#repaso" data-r="repaso">Repaso</a><a href="#farmacos" data-r="farmacos">Fármacos A-Z</a>
    </nav>
    <nav id="tabs" aria-label="Bloques y temas"></nav>
  </aside>
  <main id="contenido" tabindex="-1"></main>
</div>
<script>
var BLOQUES = [
 {id:"I",  nombre:"Principios generales", color:"b1", temas:[1,2,3], desc:"Qué es un medicamento, qué hace el cuerpo con él, qué hace él con el cuerpo y cuándo hace daño."},
 {id:"II", nombre:"Sistema nervioso autónomo", color:"b2", temas:[4,5,6,7,8], desc:"Simpático y parasimpático: neurotransmisor, receptor, efecto y fármaco."},
 {id:"III",nombre:"Autacoides", color:"b3", temas:[9,10], desc:"Histamina, serotonina y migraña."},
 {id:"IV", nombre:"Sistema nervioso periférico somático", color:"b4", temas:[11,12], desc:"Anestésicos locales y relajantes musculares."},
 {id:"V",  nombre:"Sistema nervioso central", color:"b5", temas:[13,14,15,16,17,18], desc:"Parkinson, depresión, ansiedad, epilepsia, psicosis y anestesia general."},
 {id:"VI", nombre:"Dolor e inflamación", color:"b6", temas:[19,20,21], desc:"AINE, glucocorticoides y opioides."}
];

var S = 'font-family:var(--body);font-size:13px;';
var FIGS = {
curva: {cap:"Curva de concentración plasmática tras una dosis oral. El efecto aparece cuando la concentración supera la mínima eficaz y es seguro mientras no alcance la tóxica: ese intervalo es la ventana terapéutica.",
svg:'<svg viewBox="0 0 640 300" role="img" aria-label="Curva de concentración plasmática frente al tiempo con ventana terapéutica" style="'+S+'">'+
'<rect x="70" y="95" width="540" height="85" style="fill:var(--c);opacity:.12"/>'+
'<line x1="70" y1="95" x2="610" y2="95" style="stroke:var(--bad);stroke-dasharray:6 5;stroke-width:1.5"/>'+
'<line x1="70" y1="180" x2="610" y2="180" style="stroke:var(--ok);stroke-dasharray:6 5;stroke-width:1.5"/>'+
'<text x="606" y="88" text-anchor="end" style="fill:var(--bad);font-weight:700">Concentración mínima tóxica</text>'+
'<text x="606" y="198" text-anchor="end" style="fill:var(--ok);font-weight:700">Concentración mínima eficaz</text>'+
'<text x="90" y="140" style="fill:var(--c);font-weight:700">Ventana terapéutica</text>'+
'<path d="M70 260 C 120 110, 170 70, 210 72 S 330 150, 420 205 S 560 250, 610 255" style="fill:none;stroke:var(--ink);stroke-width:3"/>'+
'<line x1="70" y1="20" x2="70" y2="262" style="stroke:var(--muted)"/><line x1="70" y1="262" x2="615" y2="262" style="stroke:var(--muted)"/>'+
'<circle cx="208" cy="72" r="5" style="fill:var(--ink)"/><text x="218" y="62" style="fill:var(--ink);font-weight:700">Cmáx</text>'+
'<line x1="208" y1="72" x2="208" y2="262" style="stroke:var(--muted);stroke-dasharray:3 4"/><text x="208" y="280" text-anchor="middle" style="fill:var(--muted)">tmáx</text>'+
'<line x1="103" y1="180" x2="103" y2="262" style="stroke:var(--muted);stroke-dasharray:3 4"/><text x="103" y="280" text-anchor="middle" style="fill:var(--muted)">inicio del efecto</text>'+
'<line x1="400" y1="180" x2="400" y2="262" style="stroke:var(--muted);stroke-dasharray:3 4"/>'+
'<text x="252" y="244" text-anchor="middle" style="fill:var(--muted)">duración del efecto</text><line x1="108" y1="250" x2="396" y2="250" style="stroke:var(--muted);marker-end:url(#ah);marker-start:url(#ah)"/>'+
'<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" style="fill:var(--muted)"/></marker></defs>'+
'<text x="30" y="140" transform="rotate(-90 30 140)" text-anchor="middle" style="fill:var(--muted)">Concentración plasmática</text><text x="610" y="296" text-anchor="end" style="fill:var(--muted)">Tiempo</text></svg>'},

potencia: {cap:"Eficacia y potencia. El fármaco A es más potente (necesita menos dosis para el 50 % de su efecto: menor DE₅₀), pero B es más eficaz (alcanza un efecto máximo mayor).",
svg:'<svg viewBox="0 0 640 280" role="img" aria-label="Curvas dosis-respuesta de dos fármacos" style="'+S+'">'+
'<line x1="70" y1="20" x2="70" y2="240" style="stroke:var(--muted)"/><line x1="70" y1="240" x2="615" y2="240" style="stroke:var(--muted)"/>'+
'<line x1="70" y1="40" x2="615" y2="40" style="stroke:var(--line);stroke-dasharray:4 4"/><text x="64" y="44" text-anchor="end" style="fill:var(--muted)">100 %</text>'+
'<line x1="70" y1="120" x2="615" y2="120" style="stroke:var(--line);stroke-dasharray:4 4"/><text x="64" y="124" text-anchor="end" style="fill:var(--muted)">60 %</text>'+
'<path d="M70 238 C 150 236, 170 200, 200 170 S 250 122, 330 121 L 610 120" style="fill:none;stroke:var(--c);stroke-width:3"/>'+
'<path d="M70 239 C 250 238, 300 200, 350 140 S 430 42, 520 41 L 610 40" style="fill:none;stroke:var(--ink);stroke-width:3"/>'+
'<text x="250" y="110" style="fill:var(--c);font-weight:700">A: más potente, menos eficaz</text>'+
'<text x="430" y="30" style="fill:var(--ink);font-weight:700">B: más eficaz</text>'+
'<circle cx="205" cy="180" r="5" style="fill:var(--c)"/><line x1="205" y1="180" x2="205" y2="240" style="stroke:var(--c);stroke-dasharray:3 4"/><text x="205" y="258" text-anchor="middle" style="fill:var(--c)">DE₅₀ de A</text>'+
'<circle cx="372" cy="140" r="5" style="fill:var(--ink)"/><line x1="372" y1="140" x2="372" y2="240" style="stroke:var(--ink);stroke-dasharray:3 4"/><text x="372" y="258" text-anchor="middle" style="fill:var(--ink)">DE₅₀ de B</text>'+
